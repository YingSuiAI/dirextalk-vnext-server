name: dirextalk-vnext-production

# Every image input is required and must already contain an immutable digest.
# The server image is published as dirextalk/vnet-server:<version>, then
# consumed here only as dirextalk/vnet-server@sha256:<64> after read-back.
x-server-image: &server-image
  image: ${DTX_SERVER_IMAGE:?set dirextalk/vnet-server@sha256:<64>}
x-migrator-image: &migrator-image
  image: ${DTX_MIGRATOR_IMAGE:?set dirextalk/vnet-server@sha256:<64>}
x-postgres-image: &postgres-image
  image: ${DTX_POSTGRES_IMAGE:?set postgres image@sha256:<64>}
x-probe-image: &probe-image
  image: ${DTX_PROBE_IMAGE:?set curlimages/curl@sha256:<64>}

services:
  postgres:
    <<: *postgres-image
    environment:
      POSTGRES_DB: dtx_node
      POSTGRES_USER: dtx_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
    secrets:
      - postgres-admin-password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtx_admin -d dtx_node"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  bootstrap-roles:
    <<: *migrator-image
    command: ["bootstrap-roles"]
    environment:
      DTX_ADMIN_DATABASE_URL_FILE: /run/dtx-secrets/admin-database-url
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/admin-database-url:/run/dtx-secrets/admin-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/role-passwords:/run/dtx-production/role-passwords:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *migrator-image
    command: ["migrate"]
    environment:
      DTX_DATABASE_URL_FILE: /run/dtx-secrets/admin-database-url
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/admin-database-url:/run/dtx-secrets/admin-database-url:ro
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: "no"

  grant-roles:
    <<: *migrator-image
    command: ["grant-roles"]
    environment:
      DTX_ADMIN_DATABASE_URL_FILE: /run/dtx-secrets/admin-database-url
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/admin-database-url:/run/dtx-secrets/admin-database-url:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  verify-roles:
    <<: *migrator-image
    command: ["verify-roles"]
    environment:
      DTX_ADMIN_DATABASE_URL_FILE: /run/dtx-secrets/admin-database-url
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/admin-database-url:/run/dtx-secrets/admin-database-url:ro
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    restart: "no"

  dtx-node:
    <<: *server-image
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-node"]
    environment:
      DTX_NODE_LISTEN: 0.0.0.0:8443
      DTX_NODE_PUBLIC_ORIGIN: ${DTX_NODE_PUBLIC_ORIGIN:?set https origin}
      DTX_NODE_TENANT_ID: ${DTX_NODE_TENANT_ID:?set tenant id}
      DTX_IDENTITY_DATABASE_URL_FILE: /run/dtx-secrets/identity-database-url
      DTX_GROUP_DATABASE_URL_FILE: /run/dtx-secrets/group-database-url
      DTX_MAILBOX_DATABASE_URL_FILE: /run/dtx-secrets/mailbox-database-url
      DTX_GROUP_MLS_SEQUENCER_KEY_FILE: /run/dtx-tls/mls-sequencer-key.pem
      DTX_NODE_TLS_CERTIFICATE_FILE: /run/dtx-tls/node-cert.pem
      DTX_NODE_TLS_PRIVATE_KEY_FILE: /run/dtx-tls/node-key.pem
      DTX_GROUP_FEDERATED_IDENTITY_TRUST_ROOT_FILE: /run/dtx-tls/private-ca.pem
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/identity-database-url:/run/dtx-secrets/identity-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/group-database-url:/run/dtx-secrets/group-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/mailbox-database-url:/run/dtx-secrets/mailbox-database-url:ro
      - ${DTX_TLS_ROOT:?set TLS root}:/run/dtx-tls:ro
    depends_on:
      verify-roles:
        condition: service_completed_successfully
    expose: ["8443"]
    restart: unless-stopped

  # Root-only, one-shot issuer. The host helper supplies the fixed request
  # and output files under /etc/dirextalk/vnext/client-binding; no arbitrary
  # command, path, or environment passthrough is accepted.
  client-binding-issuer:
    <<: *server-image
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-identity-provision"]
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/identity-database-url:/run/dtx-secrets/identity-database-url:ro
      - /etc/dirextalk/vnext/client-binding:/run/dtx-client-binding
    command:
      - client-binding-issue
      - --database-url-file
      - /run/dtx-secrets/identity-database-url
      - --request-file
      - /run/dtx-client-binding/request.json
      - --output-file
      - /run/dtx-client-binding/import.json
    profiles: ["client-binding"]

  # One-shot deployment ticket issuer. Only ticket/capability digests are
  # durable in Postgres; the short-lived export is removed by the host helper.
  deployment-binding-ticket-issuer:
    <<: *server-image
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-identity-provision"]
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/identity-database-url:/run/dtx-secrets/identity-database-url:ro
      - /etc/dirextalk/vnext/deployment-binding:/run/dtx-deployment-binding
    command:
      - deployment-binding-ticket-issue
      - --database-url-file
      - /run/dtx-secrets/identity-database-url
      - --request-file
      - /run/dtx-deployment-binding/request.json
      - --output-file
      - /run/dtx-deployment-binding/ticket.json
    profiles: ["deployment-binding"]

  client-binding-expirer:
    <<: *server-image
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-identity-provision"]
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/identity-database-url:/run/dtx-secrets/identity-database-url:ro
    command: ["client-binding-expire", "--database-url-file", "/run/dtx-secrets/identity-database-url"]
    profiles: ["client-binding-expire"]

  client-binding-revoker:
    <<: *server-image
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-identity-provision"]
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/identity-database-url:/run/dtx-secrets/identity-database-url:ro
      - /etc/dirextalk/vnext/client-binding:/run/dtx-client-binding:ro
    command: ["client-binding-revoke", "--database-url-file", "/run/dtx-secrets/identity-database-url", "--binding-id-file", "/run/dtx-client-binding/revoke-binding-id"]
    profiles: ["client-binding-revoke"]

  node-ready:
    <<: *probe-image
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["curl"]
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-connrefused
      - --retry-delay
      - "2"
      - --cacert
      - /run/dtx-tls/private-ca.pem
      - --connect-to
      - ${DTX_NODE_HOSTNAME:?set node hostname}:8443:dtx-node:8443
      - https://${DTX_NODE_HOSTNAME:?set node hostname}:8443/local/ready
    volumes:
      - ${DTX_TLS_ROOT:?set TLS root}/private-ca.pem:/run/dtx-tls/private-ca.pem:ro
    depends_on:
      dtx-node:
        condition: service_started
    restart: "no"

  realtime-gateway:
    <<: *server-image
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-realtime-sync-gateway"]
    environment:
      DTX_REALTIME_SYNC_BIND: 0.0.0.0:9444
      DTX_REALTIME_SYNC_DATABASE_URL_FILE: /run/dtx-secrets/realtime-database-url
      DTX_REALTIME_SYNC_TLS_CERTIFICATE_FILE: /run/dtx-tls/gateway-cert.pem
      DTX_REALTIME_SYNC_TLS_PRIVATE_KEY_FILE: /run/dtx-tls/gateway-key.pem
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/realtime-database-url:/run/dtx-secrets/realtime-database-url:ro
      - ${DTX_TLS_ROOT:?set TLS root}:/run/dtx-tls:ro
    depends_on:
      verify-roles:
        condition: service_completed_successfully
    expose: ["9444"]
    restart: unless-stopped

  realtime-ready:
    <<: *probe-image
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["curl"]
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-connrefused
      - --retry-delay
      - "2"
      - --cacert
      - /run/dtx-tls/private-ca.pem
      - --connect-to
      - ${DTX_NODE_HOSTNAME:?set node hostname}:9444:realtime-gateway:9444
      - https://${DTX_NODE_HOSTNAME:?set node hostname}:9444/local/ready
    volumes:
      - ${DTX_TLS_ROOT:?set TLS root}/private-ca.pem:/run/dtx-tls/private-ca.pem:ro
    depends_on:
      realtime-gateway:
        condition: service_started
    restart: "no"

  opaque-push:
    <<: *server-image
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETGID", "SETUID"]
    entrypoint: ["/usr/local/bin/dtx-opaque-push-broker"]
    environment:
      DTX_PUSH_TENANT_ID: ${DTX_NODE_TENANT_ID:?set tenant id}
      DTX_PUSH_BIND: 0.0.0.0:9448
      DTX_PUSH_READY_BIND: 127.0.0.1:9488
      DTX_PUSH_UID: "10001"
      DTX_PUSH_GID: "10001"
      DTX_PUSH_IDENTITY_LOGIN: dtx_push_identity_auth
      DTX_PUSH_REGISTRATION_LOGIN: dtx_push_registration
      DTX_PUSH_BROKER_LOGIN: dtx_push_broker
      DTX_PUSH_IDENTITY_DATABASE_URL_FILE: /run/dtx-push-secrets/identity-database-url
      DTX_PUSH_REGISTRATION_DATABASE_URL_FILE: /run/dtx-push-secrets/registration-database-url
      DTX_PUSH_BROKER_DATABASE_URL_FILE: /run/dtx-push-secrets/broker-database-url
      DTX_PUSH_ROOT_KEY_FILE: /run/dtx-push-secrets/root-key
      DTX_PUSH_FCM_SERVICE_ACCOUNT_FILE: /run/dtx-push-secrets/fcm-service-account.json
      DTX_PUSH_TLS_CERTIFICATE_FILE: /run/dtx-push-secrets/tls-certificate.pem
      DTX_PUSH_TLS_PRIVATE_KEY_FILE: /run/dtx-push-secrets/tls-private-key.pem
    volumes:
      - ${DTX_SECRET_ROOT:?set secret root}/push-identity-database-url:/run/dtx-push-secrets/identity-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/push-registration-database-url:/run/dtx-push-secrets/registration-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/push-broker-database-url:/run/dtx-push-secrets/broker-database-url:ro
      - ${DTX_SECRET_ROOT:?set secret root}/push-root-key:/run/dtx-push-secrets/root-key:ro
      - ${DTX_SECRET_ROOT:?set secret root}/push-fcm-service-account.json:/run/dtx-push-secrets/fcm-service-account.json:ro
      - ${DTX_TLS_ROOT:?set TLS root}/push-certificate.pem:/run/dtx-push-secrets/tls-certificate.pem:ro
      - ${DTX_TLS_ROOT:?set TLS root}/push-private-key.pem:/run/dtx-push-secrets/tls-private-key.pem:ro
    depends_on:
      verify-roles:
        condition: service_completed_successfully
    expose: ["9448"]
    restart: unless-stopped

  opaque-push-ready:
    <<: *probe-image
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["curl"]
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-connrefused
      - --retry-delay
      - "2"
      - http://127.0.0.1:9488/local/ready
    network_mode: service:opaque-push
    depends_on:
      opaque-push:
        condition: service_started
    restart: "no"

  agent-control:
    <<: *server-image
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/dtx-agent-control"]
    command: ["--config", "/etc/dirextalk/agent-control.json"]
    profiles: ["agent-control"]
    volumes:
      - ${DTX_CONFIG_ROOT:?set config root}/agent-control.json:/etc/dirextalk/agent-control.json:ro
      - ${DTX_SECRET_ROOT:?set secret root}/agent-control:/run/dtx-agent-control-secrets:ro
      - ${DTX_TLS_ROOT:?set TLS root}:/run/dtx-agent-control-tls:ro
    depends_on:
      verify-roles:
        condition: service_completed_successfully
    expose: ["9443", "9444", "9445"]
    ports:
      - "${DTX_AGENT_CONTROL_BIND:-127.0.0.1}:9443:9443"
      - "${DTX_AGENT_CONTROL_BIND:-127.0.0.1}:9444:9444"
      - "${DTX_AGENT_CONTROL_BIND:-127.0.0.1}:9445:9445"
    restart: unless-stopped

  agent-control-ready:
    <<: *probe-image
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["curl"]
    command: ["--fail", "--silent", "--show-error", "--retry", "30", "--retry-connrefused", "--retry-delay", "2", "http://127.0.0.1:9080/ready"]
    profiles: ["agent-control"]
    network_mode: service:agent-control
    depends_on:
      agent-control:
        condition: service_started
    restart: "no"

  caddy:
    image: ${DTX_CADDY_IMAGE:?set caddy image@sha256:<64>}
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      DTX_NODE_HOSTNAME: ${DTX_NODE_HOSTNAME:?set node hostname}
    volumes:
      - ${DTX_CONFIG_ROOT:?set config root}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DTX_TLS_ROOT:?set TLS root}/private-ca.pem:/data/caddy/private-ca.pem:ro
      - ${DTX_TLS_ROOT:?set TLS root}/server-cert.pem:/data/caddy/server-cert.pem:ro
      - ${DTX_TLS_ROOT:?set TLS root}/server-key.pem:/data/caddy/server-key.pem:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      node-ready:
        condition: service_completed_successfully
      realtime-ready:
        condition: service_completed_successfully
      opaque-push-ready:
        condition: service_completed_successfully
    ports:
      - "443:443"
      - "80:80"
    restart: unless-stopped

secrets:
  postgres-admin-password:
    file: ${DTX_SECRET_ROOT:?set secret root}/postgres-admin-password

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
