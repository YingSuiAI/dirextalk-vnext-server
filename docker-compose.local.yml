name: dirextalk-vnext-local

x-dev-image: &dev-image
  image: dirextalk-vnext-local:dev

x-node-healthcheck: &node-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/dtx-local-tls/ca.pem https://localhost:8443/local/ready >/dev/null"]
  interval: 2s
  timeout: 3s
  retries: 15
  start_period: 2s

x-node-environment: &node-environment
  DTX_NODE_LISTEN: 0.0.0.0:8443
  DTX_GROUP_FEDERATED_IDENTITY_TRUST_ROOT_FILE: /run/dtx-local-tls/ca.pem

x-gateway-healthcheck: &gateway-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/dtx-local-tls/ca.pem https://localhost:9444/local/ready >/dev/null"]
  interval: 2s
  timeout: 3s
  retries: 15
  start_period: 2s

x-opaque-push-healthcheck: &opaque-push-healthcheck
  test: ["CMD-SHELL", "test \"$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9488/local/ready)\" = 204"]
  interval: 2s
  timeout: 3s
  retries: 15
  start_period: 2s

x-opaque-push-environment: &opaque-push-environment
  DTX_PUSH_BIND: 0.0.0.0:9448
  DTX_PUSH_READY_BIND: 127.0.0.1:9488
  DTX_PUSH_UID: "10001"
  DTX_PUSH_GID: "10001"
  DTX_PUSH_IDENTITY_LOGIN: dtx_push_identity_auth
  DTX_PUSH_REGISTRATION_LOGIN: dtx_push_registration
  DTX_PUSH_BROKER_LOGIN: dtx_push_broker

x-opaque-push-service: &opaque-push-service
  <<: *dev-image
  profiles: ["opaque-push"]
  user: "0:0"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  cap_add: ["SETGID", "SETUID"]
  entrypoint: ["/usr/local/bin/dtx-opaque-push-broker"]
  volumes:
    - dtx-local-opaque-push-secrets:/run/dtx-opaque-push-secrets:ro
  healthcheck: *opaque-push-healthcheck

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: dtx_admin
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    volumes:
      - dtx-local-postgres:/var/lib/postgresql
      - ./docker/local/postgres/00-local-cluster.sql:/docker-entrypoint-initdb.d/00-local-cluster.sql:ro
    ports:
      - "127.0.0.1:${DTX_LOCAL_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dtx_admin"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  provision-roles:
    image: postgres:18.4-alpine3.24
    command: ["psql", "--set=ON_ERROR_STOP=1", "--username=postgres", "--dbname=postgres://postgres@postgres:5432/dtx_admin?sslmode=disable", "--file=/bootstrap/10-local-runtime-roles.sql"]
    volumes:
      - ./docker/local/postgres/10-local-runtime-roles.sql:/bootstrap/10-local-runtime-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tls-volume-init:
    <<: *dev-image
    user: "0:0"
    entrypoint: ["/bin/chown"]
    command: ["10001:10001", "/run/dtx-local-tls"]
    volumes:
      - dtx-local-tls:/run/dtx-local-tls
    restart: "no"

  tls-bootstrap:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-dev-local-tls"]
    environment:
      DTX_LOCAL_TLS_DIR: /run/dtx-local-tls
    volumes:
      - dtx-local-tls:/run/dtx-local-tls
    depends_on:
      tls-volume-init:
        condition: service_completed_successfully
    restart: "no"

  migrate-a:
    <<: *dev-image
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    command: ["/usr/local/bin/dtx-dev-migrate"]
    environment:
      DTX_DATABASE_URL: postgres://postgres@postgres:5432/dtx_node_a?sslmode=disable
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    restart: "no"

  migrate-b:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-dev-migrate"]
    environment:
      DTX_DATABASE_URL: postgres://postgres@postgres:5432/dtx_node_b?sslmode=disable
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    restart: "no"

  # Keep this idempotent bootstrap for an existing A/B volume upgraded to the
  # three-node topology. It exits after ensuring the C database exists.
  bootstrap-c:
    image: postgres:18.4-alpine3.24
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql --set=ON_ERROR_STOP=1 --username=postgres \
          --dbname=postgres://postgres@postgres:5432/postgres?sslmode=disable \
          --tuples-only --no-align \
          --command="SELECT 1 FROM pg_database WHERE datname = 'dtx_node_c'" \
          | grep -qx 1 \
          || psql --set=ON_ERROR_STOP=1 --username=postgres \
            --dbname=postgres://postgres@postgres:5432/postgres?sslmode=disable \
            --command="CREATE DATABASE dtx_node_c OWNER postgres"
    depends_on:
      provision-roles:
        condition: service_completed_successfully
    restart: "no"

  migrate-c:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-dev-migrate"]
    environment:
      DTX_DATABASE_URL: postgres://postgres@postgres:5432/dtx_node_c?sslmode=disable
    depends_on:
      bootstrap-c:
        condition: service_completed_successfully
    restart: "no"

  provision-a:
    image: postgres:18.4-alpine3.24
    command: ["psql", "--set=ON_ERROR_STOP=1", "--username=postgres", "--dbname=postgres://postgres@postgres:5432/dtx_node_a?sslmode=disable", "--file=/bootstrap/20-local-runtime-grants.sql"]
    volumes:
      - ./docker/local/postgres/20-local-runtime-grants.sql:/bootstrap/20-local-runtime-grants.sql:ro
    depends_on:
      migrate-a:
        condition: service_completed_successfully
    restart: "no"

  provision-b:
    image: postgres:18.4-alpine3.24
    command: ["psql", "--set=ON_ERROR_STOP=1", "--username=postgres", "--dbname=postgres://postgres@postgres:5432/dtx_node_b?sslmode=disable", "--file=/bootstrap/20-local-runtime-grants.sql"]
    volumes:
      - ./docker/local/postgres/20-local-runtime-grants.sql:/bootstrap/20-local-runtime-grants.sql:ro
    depends_on:
      migrate-b:
        condition: service_completed_successfully
    restart: "no"

  provision-c:
    image: postgres:18.4-alpine3.24
    command: ["psql", "--set=ON_ERROR_STOP=1", "--username=postgres", "--dbname=postgres://postgres@postgres:5432/dtx_node_c?sslmode=disable", "--file=/bootstrap/20-local-runtime-grants.sql"]
    volumes:
      - ./docker/local/postgres/20-local-runtime-grants.sql:/bootstrap/20-local-runtime-grants.sql:ro
    depends_on:
      migrate-c:
        condition: service_completed_successfully
    restart: "no"

  node-a:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-node-local"]
    environment:
      <<: *node-environment
      DTX_DEV_IDENTITY_DATABASE_URL: postgres://dtx_identity_node@postgres:5432/dtx_node_a?sslmode=disable
      DTX_DEV_GROUP_DATABASE_URL: postgres://dtx_group_node@postgres:5432/dtx_node_a?sslmode=disable
      DTX_DEV_MAILBOX_DATABASE_URL: postgres://dtx_mailbox_node@postgres:5432/dtx_node_a?sslmode=disable
      DTX_NODE_PUBLIC_ORIGIN: https://node-a:8443
      DTX_NODE_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-a-cert.pem
      DTX_NODE_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-a-key.pem
      DTX_NODE_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a0
    depends_on:
      provision-a:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DTX_ANDROID_NODE_A_PORT:-18443}:8443"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *node-healthcheck

  node-b:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-node-local"]
    environment:
      <<: *node-environment
      DTX_DEV_IDENTITY_DATABASE_URL: postgres://dtx_identity_node@postgres:5432/dtx_node_b?sslmode=disable
      DTX_DEV_GROUP_DATABASE_URL: postgres://dtx_group_node@postgres:5432/dtx_node_b?sslmode=disable
      DTX_DEV_MAILBOX_DATABASE_URL: postgres://dtx_mailbox_node@postgres:5432/dtx_node_b?sslmode=disable
      DTX_NODE_PUBLIC_ORIGIN: https://node-b:8443
      DTX_NODE_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-b-cert.pem
      DTX_NODE_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-b-key.pem
      DTX_NODE_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a1
    depends_on:
      provision-b:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DTX_ANDROID_NODE_B_PORT:-18444}:8443"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *node-healthcheck

  node-c:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-node-local"]
    environment:
      <<: *node-environment
      DTX_DEV_IDENTITY_DATABASE_URL: postgres://dtx_identity_node@postgres:5432/dtx_node_c?sslmode=disable
      DTX_DEV_GROUP_DATABASE_URL: postgres://dtx_group_node@postgres:5432/dtx_node_c?sslmode=disable
      DTX_DEV_MAILBOX_DATABASE_URL: postgres://dtx_mailbox_node@postgres:5432/dtx_node_c?sslmode=disable
      DTX_NODE_PUBLIC_ORIGIN: https://node-c:8443
      DTX_NODE_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-c-cert.pem
      DTX_NODE_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-c-key.pem
      DTX_NODE_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a2
    depends_on:
      provision-c:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18445:8443"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *node-healthcheck

  realtime-a:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-realtime-sync-gateway"]
    environment:
      DTX_REALTIME_SYNC_BIND: 0.0.0.0:9444
      DTX_REALTIME_SYNC_DATABASE_URL: postgres://dtx_realtime_sync_gateway@postgres:5432/dtx_node_a?sslmode=disable
      DTX_REALTIME_SYNC_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-a-cert.pem
      DTX_REALTIME_SYNC_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-a-key.pem
    depends_on:
      provision-a:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19443:9444"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *gateway-healthcheck

  realtime-b:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-realtime-sync-gateway"]
    environment:
      DTX_REALTIME_SYNC_BIND: 0.0.0.0:9444
      DTX_REALTIME_SYNC_DATABASE_URL: postgres://dtx_realtime_sync_gateway@postgres:5432/dtx_node_b?sslmode=disable
      DTX_REALTIME_SYNC_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-b-cert.pem
      DTX_REALTIME_SYNC_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-b-key.pem
    depends_on:
      provision-b:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19444:9444"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *gateway-healthcheck

  realtime-c:
    <<: *dev-image
    command: ["/usr/local/bin/dtx-realtime-sync-gateway"]
    environment:
      DTX_REALTIME_SYNC_BIND: 0.0.0.0:9444
      DTX_REALTIME_SYNC_DATABASE_URL: postgres://dtx_realtime_sync_gateway@postgres:5432/dtx_node_c?sslmode=disable
      DTX_REALTIME_SYNC_TLS_CERTIFICATE_FILE: /run/dtx-local-tls/node-c-cert.pem
      DTX_REALTIME_SYNC_TLS_PRIVATE_KEY_FILE: /run/dtx-local-tls/node-c-key.pem
    depends_on:
      provision-c:
        condition: service_completed_successfully
      tls-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19445:9444"
    volumes:
      - dtx-local-tls:/run/dtx-local-tls:ro
    healthcheck: *gateway-healthcheck

  opaque-push-a:
    <<: *opaque-push-service
    environment:
      <<: *opaque-push-environment
      DTX_PUSH_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a0
      DTX_PUSH_IDENTITY_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/a/identity-database-url
      DTX_PUSH_REGISTRATION_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/a/registration-database-url
      DTX_PUSH_BROKER_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/a/broker-database-url
      DTX_PUSH_ROOT_KEY_FILE: /run/dtx-opaque-push-secrets/a/root-key
      DTX_PUSH_FCM_SERVICE_ACCOUNT_FILE: /run/dtx-opaque-push-secrets/a/fcm-service-account.json
      DTX_PUSH_TLS_CERTIFICATE_FILE: /run/dtx-opaque-push-secrets/a/tls-certificate.pem
      DTX_PUSH_TLS_PRIVATE_KEY_FILE: /run/dtx-opaque-push-secrets/a/tls-private-key.pem
    depends_on:
      provision-a:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19448:9448"

  opaque-push-b:
    <<: *opaque-push-service
    environment:
      <<: *opaque-push-environment
      DTX_PUSH_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a1
      DTX_PUSH_IDENTITY_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/b/identity-database-url
      DTX_PUSH_REGISTRATION_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/b/registration-database-url
      DTX_PUSH_BROKER_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/b/broker-database-url
      DTX_PUSH_ROOT_KEY_FILE: /run/dtx-opaque-push-secrets/b/root-key
      DTX_PUSH_FCM_SERVICE_ACCOUNT_FILE: /run/dtx-opaque-push-secrets/b/fcm-service-account.json
      DTX_PUSH_TLS_CERTIFICATE_FILE: /run/dtx-opaque-push-secrets/b/tls-certificate.pem
      DTX_PUSH_TLS_PRIVATE_KEY_FILE: /run/dtx-opaque-push-secrets/b/tls-private-key.pem
    depends_on:
      provision-b:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19449:9448"

  opaque-push-c:
    <<: *opaque-push-service
    environment:
      <<: *opaque-push-environment
      DTX_PUSH_TENANT_ID: 0190f2a5-7b1c-7abc-8def-0123456789a2
      DTX_PUSH_IDENTITY_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/c/identity-database-url
      DTX_PUSH_REGISTRATION_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/c/registration-database-url
      DTX_PUSH_BROKER_DATABASE_URL_FILE: /run/dtx-opaque-push-secrets/c/broker-database-url
      DTX_PUSH_ROOT_KEY_FILE: /run/dtx-opaque-push-secrets/c/root-key
      DTX_PUSH_FCM_SERVICE_ACCOUNT_FILE: /run/dtx-opaque-push-secrets/c/fcm-service-account.json
      DTX_PUSH_TLS_CERTIFICATE_FILE: /run/dtx-opaque-push-secrets/c/tls-certificate.pem
      DTX_PUSH_TLS_PRIVATE_KEY_FILE: /run/dtx-opaque-push-secrets/c/tls-private-key.pem
    depends_on:
      provision-c:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19450:9448"

volumes:
  dtx-local-postgres:
  dtx-local-tls:
  dtx-local-opaque-push-secrets:
    external: true
