name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.0

      - name: Install pinned Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.12.2

      - name: Verify generated and frozen protocol contracts
        run: |
          cargo run -p dtx-protocol --locked -- generate .
          if [[ -n "$(git status --porcelain --untracked-files=all -- crates/dtx-wire/src/generated protocol/generated/dart/lib/src)" ]]; then
            git status --short -- crates/dtx-wire/src/generated protocol/generated/dart/lib/src
            exit 1
          fi
          cargo run -p dtx-protocol --locked -- check-generated .
          cargo run -p dtx-protocol --locked -- validate .
          cargo run -p dtx-protocol --locked -- check-breaking .

      - name: Install locked Dart dependencies
        working-directory: protocol/generated/dart
        run: dart pub get --enforce-lockfile

      - name: Check Dart contracts
        working-directory: protocol/generated/dart
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
          dart compile js tool/web_smoke.dart -O2 -o "$RUNNER_TEMP/dtx-protocol-web-smoke.js"
          node "$RUNNER_TEMP/dtx-protocol-web-smoke.js"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install dependency policy tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Check dependency policy
        run: |
          cargo deny check
          cargo audit

      - name: Check diff hygiene
        run: git diff --check
