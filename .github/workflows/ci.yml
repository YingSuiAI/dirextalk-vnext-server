name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.0

      - name: Install pinned Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.12.2

      - name: Install Product Core verification tools
        run: |
          cargo install sqlx-cli --version 0.9.0 --force --no-default-features \
            --features rustls,postgres --root "$RUNNER_TEMP/dtx-sqlx"
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Run canonical Product Core gate
        env:
          DTX_SQLX_TOOL_ROOT: ${{ runner.temp }}/dtx-sqlx
        run: bash scripts/verify.sh
