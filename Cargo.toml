[workspace]
members = [
    "bins/dtx-agent-control",
    "bins/dtx-agent-host-supervisor",
    "bins/dtx-dev-local-tls",
    "bins/dtx-android-response-loss-proxy",
    "bins/dtx-dev-migrate",
    "bins/dtx-production-migrate",
    "bins/dtx-group-node",
    "bins/dtx-identity-node",
    "bins/dtx-indexer-node",
    "bins/dtx-mailbox-node",
    "bins/dtx-public-feed-node",
    "bins/dtx-realtime-sync-gateway",
    "bins/dtx-node",
    "bins/dtx-opaque-push-broker",
    "crates/dtx-agent-control",
    "crates/dtx-agent-control-proto",
    "crates/dtx-agent-control-server",
    "crates/dtx-agent-host",
    "crates/dtx-agent-host-supervisor",
    "crates/dtx-agent-persistence",
    "crates/dtx-agent-registry",
    "crates/dtx-agent-router",
    "crates/dtx-connect-registry",
    "crates/dtx-domain",
    "crates/dtx-contact",
    "crates/dtx-federated-identity",
    "crates/dtx-group-policy",
    "crates/dtx-group-persistence",
    "crates/dtx-history-recovery-protocol",
    "crates/dtx-history-recovery-testkit",
    "crates/dtx-history-recovery-protocol",
    "crates/dtx-http-cache",
    "crates/dtx-identity-log",
    "crates/dtx-identity-persistence",
    "crates/dtx-indexer",
    "crates/dtx-membership-command",
    "crates/dtx-mailbox",
    "crates/dtx-opaque-push",
    "crates/dtx-opaque-push-postgres",
    "crates/dtx-opaque-push-fcm",
    "crates/dtx-public-descriptor",
    "crates/dtx-public-discussion",
    "crates/dtx-public-feed",
    "crates/dtx-realtime-sync",
    "crates/dtx-security",
    "crates/dtx-storage",
    "crates/dtx-testkit",
    "crates/dtx-wire",
    "tools/dtx-protocol",
]
# Product Core Alpha release gates select these packages by default. Agent,
# Connector, Public Feed, and Indexer packages remain frozen workspace members
# for the next version but do not block the current IM release.
default-members = [
    "bins/dtx-dev-local-tls",
    "bins/dtx-dev-migrate",
    "bins/dtx-production-migrate",
    "bins/dtx-group-node",
    "bins/dtx-identity-node",
    "bins/dtx-mailbox-node",
    "bins/dtx-realtime-sync-gateway",
    "bins/dtx-node",
    "bins/dtx-opaque-push-broker",
    "crates/dtx-domain",
    "crates/dtx-contact",
    "crates/dtx-federated-identity",
    "crates/dtx-group-policy",
    "crates/dtx-group-persistence",
    "crates/dtx-identity-log",
    "crates/dtx-identity-persistence",
    "crates/dtx-membership-command",
    "crates/dtx-mailbox",
    "crates/dtx-opaque-push",
    "crates/dtx-opaque-push-postgres",
    "crates/dtx-opaque-push-fcm",
    "crates/dtx-realtime-sync",
    "crates/dtx-security",
    "crates/dtx-storage",
    "crates/dtx-testkit",
    "crates/dtx-wire",
    "tools/dtx-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.12"
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio", "ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
base64 = "0.22.1"
bytes = "1.11.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
httpdate = "1.0.3"
libc = "0.2.183"
getrandom = "0.4.3"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "x25519", "chacha"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring", "x509-parser", "zeroize"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
x509-parser = { version = "0.18.1", default-features = false }
oas3 = { version = "0.22.0", default-features = false, features = ["yaml-spec"] }
protox = "0.9.1"
prost-types = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid"] }
subtle = "2.6.1"
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["postgres", "ring"] }
time = { version = "0.3.53", default-features = false }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
uuid = { version = "1.23.5", features = ["serde", "v7"] }
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
yaml_serde = "0.10.4"
cddl-cat = { version = "0.7.1", default-features = false, features = ["ciborium"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
