syntax = "proto3";

package dirextalk.agent_control.v1;

// Agent Control is connector-initiated and outbound-only. ConnectorEnrollment
// is mounted only on the ordinary server-authenticated TLS listener;
// ConnectorControl is mounted only on the listener that requires the exact
// per-Connector mTLS identity from ADR-0005. Keeping separate services makes
// the transport trust boundary explicit rather than relying on handler checks.
//
// Every request, response, ClientFrame, and ServerFrame is capped at 262144
// encoded bytes. Implementations reject a frame with no known oneof member.
// Minor 1.6 preserves all earlier Run, provisioning, and AgentRoute contracts
// and adds explicit server capability echo plus Agent Route health-key binding.
// The health key is generated and retained by the native sidecar; this stream
// carries only its public identifier/key and fixed digests. HTTP health reports
// are a separate connector-authenticated boundary.
// Minor 1.5 preserves all earlier Run, provisioning, and AgentRoute contracts
// and adds the ordinary acknowledgement for an expired recipient Prepare only
// after the Connector has durably retired the exact native and Connector
// recipient state. Minor 1.4 preserves all earlier Run and provisioning
// contracts and adds opaque, fenced AgentRoute bootstrap delivery. Agent
// Control can persist and relay only identifiers, expiration facts, fixed
// digests, and opaque bytes; it must never parse an Owner intent, recipient
// capsule, bootstrap capsule, mailbox descriptor, KeyPackage, MLS checkpoint,
// prompt, or plaintext.
// Minor 1.3 preserves the 1.2 privacy-preserving Run execution evidence and
// adds only one-time opaque Agent provisioning delivery. The Connector may
// announce a sidecar-generated recipient public key and receive an HPKE-sealed
// capsule, but root/recovery authority and capsule plaintext never enter this
// stream. Run grants are byte-for-byte unchanged from 1.2.
// Minor 1.2 adds only privacy-preserving Run execution evidence: Agent Control
// carries conversation/event/artifact identifiers and cryptographic digests,
// never prompt text, decrypted conversation content, runtime output, or
// checkpoint bytes. Connectors resolve and publish encrypted conversation data
// through the separately authorized messaging plane.
// String limits are UTF-8 byte limits and strings reject C0/C1 controls. All
// uint64 counters and millisecond timestamps are limited to
// 0..9007199254740991; fields documented as positive reject zero.
//
// Cross-language signatures and digests use this exact framing:
//   LP(x) = U64BE(byte_length(x)) || x
//   COMMIT(domain, parts...) = SHA-256(LP(ASCII(domain)) || LP(part1) || ...)
// UUID parts are the 16 RFC 4122 network-order bytes parsed from canonical
// text; integer parts are their unsigned eight-byte big-endian representation.
// The raw enrollment-token digest uses domain
// "dirextalk.connector-enrollment-token.v1" and the token as its only part.
//
// Enrollment signatures cover LP("dirextalk.connector-enrollment-proof.v1")
// followed by LP of, in order: tenant UUID, host UUID, Connector UUID,
// generation U64BE, spec revision U64BE, request UUID, token digest, control
// public key, and refresh public key. request_digest uses COMMIT domain
// "dirextalk.connector-enrollment-request.v1" with the complete signing
// transcript, control signature, and refresh signature as its three parts.
//
// Rotation signatures cover LP(
// "dirextalk.connector-credential-rotation-proof.v1") followed by LP of, in
// order: tenant UUID, Connector UUID, request UUID, authenticated current
// credential UUID, current generation U64BE, successor generation U64BE,
// command sequence U64BE, command payload digest, successor revision U64BE,
// rotation nonce, and new control public key. successor generation is exactly
// current generation + 1. request_digest uses COMMIT domain
// "dirextalk.connector-credential-rotation-request.v1" with the complete
// signing transcript, current refresh signature, and new control signature.
//
// A credential result digest uses COMMIT domain
// "dirextalk.connector-credential-result.v1" with, in order: credential UUID,
// tenant UUID, Connector UUID, generation U64BE, credential revision U64BE,
// control public key, refresh public key, leaf fingerprint, certificate count
// U64BE, each leaf-first DER certificate as its own part, valid-from U64BE, and
// valid-until U64BE. Command payload digests use COMMIT domain
// "dirextalk.connector-command-payload.v1" with the exact selected oneof
// submessage bytes as the only part. Encoded-command digests use COMMIT domain
// "dirextalk.connector-encoded-command.v1" with the complete encoded
// DurableCommand bytes as the only part.
//
// A provisioning-recipient descriptor digest uses COMMIT domain
// "dirextalk.agent-provisioning-recipient.v1" with, in order: tenant UUID,
// Connector UUID, binding UUID, installation UUID, Agent Device UUID,
// provisioning revision U64BE, recipient-key UUID, exact X25519 public key,
// created-at U64BE, expires-at U64BE, authenticated credential UUID, and
// Connector generation U64BE. recipient_signature covers LP(
// "dirextalk.agent-provisioning-recipient-signature.v1") followed by LP of
// that 32-byte digest. An installed-result digest uses COMMIT domain
// "dirextalk.agent-provisioning-installed.v1" over delivery UUID,
// recipient-key UUID, capsule digest, installation receipt digest, and
// installed-at U64BE. A rejected-result digest uses COMMIT domain
// "dirextalk.agent-provisioning-rejected.v1" over delivery UUID,
// recipient-key UUID, capsule digest, stable error-code UTF-8, and rejected-at
// U64BE. The sealed capsule digest is supplied by V23 HTTP and is never
// recomputed from plaintext by Agent Control. RouteBootstrapV1 opaque capsule
// digests are SHA-256("dirextalk.agent-route-recipient-capsule.v1\\0" ||
// opaque_recipient_capsule) and SHA-256(
// "dirextalk.agent-route-bootstrap-capsule.v1\\0" ||
// opaque_sealed_bootstrap), respectively. Route result_digest uses COMMIT
// (the length-prefixed domain commitment used by durable commands) with fields
// in this exact order:
//   recipient-ready: bootstrap UUID, tenant UUID, installation UUID, binding
//     UUID, Agent Control device UUID, recipient UUID, command sequence U64BE,
//     recipient capsule digest, expiry U64BE.
//   installed: bootstrap UUID, delivery UUID, route UUID, installation UUID,
//     binding UUID, Agent Control device UUID, recipient UUID, command
//     sequence U64BE, capsule digest, route_fence, installed-at U64BE.
//   rejected: the installed UUID/sequence/capsule prefix, stable error-code
//     UTF-8, rejected-at U64BE (without route_fence).
// No Connector or Agent Control component derives or interprets route_fence.
service ConnectorEnrollment {
  rpc EnrollConnector(EnrollConnectorRequest) returns (EnrollConnectorResponse);
  rpc ReissueConnectorCredential(ReissueConnectorCredentialRequest) returns (ReissueConnectorCredentialResponse);
}

service ConnectorControl {
  rpc Control(stream ClientFrame) returns (stream ServerFrame);
}

message EnrollConnectorRequest {
  // Exactly 32 caller-held bytes; the owner create response never echoes them.
  bytes enrollment_token = 1;
  string enrollment_request_id = 2; // Canonical lowercase UUIDv7 text.
  string tenant_id = 3; // Canonical lowercase UUIDv7 text.
  string host_id = 4; // Canonical lowercase UUIDv7 text.
  string connector_id = 5; // Canonical lowercase UUIDv7 text.
  uint64 connector_generation = 6; // Positive JSON-safe integer.
  uint64 spec_revision = 7; // Positive JSON-safe integer.
  bytes control_public_key = 8; // Exactly 32 canonical Ed25519 bytes.
  bytes refresh_public_key = 9; // Exactly 32 canonical Ed25519 bytes.
  bytes control_signature = 10; // Exactly 64 Ed25519 transcript-signature bytes.
  bytes refresh_signature = 11; // Exactly 64 Ed25519 transcript-signature bytes.
}

message EnrollConnectorResponse {
  ConnectorCredential credential = 1;
  bytes request_digest = 2; // Exactly 32 domain-separated SHA-256 bytes.
  bytes result_digest = 3; // Exactly 32 domain-separated SHA-256 bytes.
  // Additive trust pin for fresh enrollment. This is a public receipt key,
  // never a private key and never the sole transport trust root.
  string route_health_receipt_key_id = 4; // Canonical lowercase UUIDv7 text.
  bytes route_health_receipt_public_key = 5; // Exactly 32 Ed25519 bytes.
}

// One exact certificate-only recovery attempt. `reissue_token` is caller-held
// secret material and is never returned. Both signatures cover the canonical
// v1 reissue transcript defined in the protocol documentation.
message ReissueConnectorCredentialRequest {
  string operation_id = 1; // Canonical lowercase UUIDv7 text.
  string intent_id = 2; // Canonical lowercase UUIDv7 text.
  bytes reissue_token = 3; // Exactly 32 caller-held bytes.
  string tenant_id = 4; // Canonical lowercase UUIDv7 text.
  string host_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Canonical lowercase UUIDv7 text.
  string current_credential_id = 7; // Canonical lowercase UUIDv7 text.
  bytes current_leaf_fingerprint_sha256 = 8; // Exactly 32 bytes.
  uint64 connector_generation = 9; // Positive JSON-safe integer.
  uint64 spec_revision = 10; // Positive JSON-safe integer.
  bytes new_control_public_key = 11; // Exactly 32 canonical Ed25519 bytes.
  bytes current_control_signature = 12; // Exactly 64 Ed25519 signature bytes.
  bytes new_control_signature = 13; // Exactly 64 Ed25519 signature bytes.
}

message ReissueConnectorCredentialResponse {
  string operation_id = 1;
  string intent_id = 2;
  string tenant_id = 3;
  string host_id = 4;
  string connector_id = 5;
  string current_credential_id = 6;
  bytes current_leaf_fingerprint_sha256 = 7;
  uint64 connector_generation = 8;
  uint64 spec_revision = 9;
  ConnectorCredential credential = 10;
  bytes request_digest = 11; // Exactly 32 domain-separated SHA-256 bytes.
  bytes result_digest = 12; // Exactly 32 domain-separated SHA-256 bytes.
}

message ConnectorCredential {
  string credential_id = 1; // Canonical lowercase UUIDv7 text.
  uint64 credential_revision = 2; // Positive JSON-safe integer.
  repeated bytes certificate_chain_der = 3; // 1..4 entries, each 1..16384 bytes; leaf first.
  bytes leaf_fingerprint = 4; // Exactly 32 SHA-256 bytes.
  uint64 valid_from_millis = 5; // JSON-safe UTC Unix milliseconds.
  uint64 valid_until_millis = 6; // Greater than valid_from_millis.
}

message ClientFrame {
  // Exactly one known frame kind is required. Hello must be the first frame.
  oneof kind {
    Hello hello = 1;
    Ready ready = 2;
    Heartbeat heartbeat = 3;
    CommandAcknowledgement command_acknowledgement = 4;
    CredentialRotationProof credential_rotation_proof = 5;
    RunClaim run_claim = 6;
    RunRelease run_release = 7;
    RunCheckpoint run_checkpoint = 8;
    RunOutput run_output = 9;
    RunCompleted run_completed = 10;
    RunFailed run_failed = 11;
    ProvisioningRecipientAnnouncement provisioning_recipient_announcement = 12;
    AgentProvisioningInstalled agent_provisioning_installed = 13;
    AgentProvisioningRejected agent_provisioning_rejected = 14;
    AgentRouteRecipientReady agent_route_recipient_ready = 15;
    AgentRouteBootstrapInstalled agent_route_bootstrap_installed = 16;
    AgentRouteBootstrapRejected agent_route_bootstrap_rejected = 17;
  }
}

message ServerFrame {
  // Exactly one known frame kind is required. ConnectLease is the first
  // successful response to Hello. Protocol failures use a bounded gRPC status.
  oneof kind {
    ConnectLease connect_lease = 1;
    HeartbeatAcknowledgement heartbeat_acknowledgement = 2;
    DurableCommandFrame durable_command = 3;
    CredentialRotationResult credential_rotation_result = 4;
    RunAvailable run_available = 5;
    RunLeaseGranted run_lease_granted = 6;
    RunCancelRequested run_cancel_requested = 7;
    RunReportAcknowledged run_report_acknowledged = 8;
  }
}

// A capability-scoped run offer. This frame is not execution authorization;
// only the matching RunLeaseGranted authorizes connector-side execution.
message RunAvailable {
  LeaseFence connector_fence = 1;
  string run_id = 2; // Canonical lowercase UUIDv7 text.
  string request_id = 3; // Canonical lowercase UUIDv7 text.
  string installation_id = 4; // Canonical lowercase UUIDv7 text.
  string binding_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Must equal connector_fence.connector_id.
  uint64 offer_attempt = 7; // Positive JSON-safe integer.
  uint64 offered_at_millis = 8; // Server-clock UTC Unix milliseconds.
  uint64 offer_deadline_millis = 9; // Greater than offered_at_millis.
  repeated string required_capabilities = 10; // At most 64 unique stable names, each 1..128 bytes.
}

// Offer acknowledgement only. A RunClaim reserves no execution authority;
// the connector must wait for the matching RunLeaseGranted.
message RunClaim {
  LeaseFence connector_fence = 1;
  string run_id = 2; // Canonical lowercase UUIDv7 text.
  string request_id = 3; // Canonical lowercase UUIDv7 text.
  string installation_id = 4; // Canonical lowercase UUIDv7 text.
  string binding_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Must equal connector_fence.connector_id.
  uint64 offer_attempt = 7; // Exact RunAvailable attempt.
  uint64 offer_deadline_millis = 8; // Exact RunAvailable deadline.
  repeated string required_capabilities = 9; // Exact normalized RunAvailable capability set.
}

// The sole v1.1 frame that authorizes execution. Both the Connector fence and
// the run-lease fence must remain current for any resulting side effect.
message RunLeaseGranted {
  LeaseFence connector_fence = 1;
  string run_id = 2; // Canonical lowercase UUIDv7 text.
  string request_id = 3; // Canonical lowercase UUIDv7 text.
  string installation_id = 4; // Canonical lowercase UUIDv7 text.
  string binding_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Must equal connector_fence.connector_id.
  uint64 offer_attempt = 7; // Exact accepted RunAvailable attempt.
  string run_lease_id = 8; // Canonical lowercase UUIDv7 text.
  uint64 run_lease_epoch = 9; // Positive JSON-safe integer.
  uint64 granted_at_millis = 10; // Server-clock UTC Unix milliseconds.
  uint64 run_lease_deadline_millis = 11; // Greater than granted_at_millis.
  repeated string required_capabilities = 12; // Exact normalized authorized capability set.
  string conversation_id = 13; // Authorized canonical lowercase UUIDv7 conversation.
  string input_event_id = 14; // Encrypted input event resolved outside Agent Control.
  uint64 grant_version = 15; // Exact live Conversation Grant version authorized at claim.
}

// Explicit release of a granted run lease. This carries both the Connector
// fence and run-lease fence; it is not a checkpoint, output, completion, or
// failure report.
message RunRelease {
  LeaseFence connector_fence = 1;
  string run_id = 2; // Canonical lowercase UUIDv7 text.
  string request_id = 3; // Canonical lowercase UUIDv7 text.
  string installation_id = 4; // Canonical lowercase UUIDv7 text.
  string binding_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Must equal connector_fence.connector_id.
  uint64 offer_attempt = 7; // Exact granted offer attempt.
  string run_lease_id = 8; // Canonical lowercase UUIDv7 text.
  uint64 run_lease_epoch = 9; // Positive JSON-safe integer.
  uint64 run_lease_deadline_millis = 10; // Exact granted deadline.
  string stable_reason = 11; // 3..64 bytes, UPPER_SNAKE_CASE.
}

// Complete authority fence copied from the matching RunLeaseGranted. Exact
// retries repeat the same frame; any stale Connector or Run lease member is
// rejected before state mutation.
message RunExecutionFence {
  LeaseFence connector_fence = 1;
  string run_id = 2; // Canonical lowercase UUIDv7 text.
  string request_id = 3; // Canonical lowercase UUIDv7 text.
  string installation_id = 4; // Canonical lowercase UUIDv7 text.
  string binding_id = 5; // Canonical lowercase UUIDv7 text.
  string connector_id = 6; // Must equal connector_fence.connector_id.
  uint64 offer_attempt = 7; // Exact granted offer attempt.
  string run_lease_id = 8; // Canonical lowercase UUIDv7 text.
  uint64 run_lease_epoch = 9; // Exact positive granted epoch.
  uint64 run_lease_deadline_millis = 10; // Exact granted deadline.
}

// Durable progress references only. The referenced checkpoint is encrypted for
// the Agent Device/runtime boundary and is never uploaded through this stream.
message RunCheckpoint {
  RunExecutionFence execution_fence = 1;
  uint64 checkpoint_sequence = 2; // Starts at 1 and advances contiguously.
  string checkpoint_artifact_id = 3; // Canonical lowercase UUIDv7 artifact reference.
  bytes checkpoint_digest = 4; // Exactly 32 domain-separated SHA-256 bytes.
}

// One encrypted conversation output-event claim. Sequence starts at 1 and is
// contiguous independently of checkpoint_sequence. Agent Control persists only
// the signed event reference and digest, never its body.
message RunOutput {
  RunExecutionFence execution_fence = 1;
  uint64 output_sequence = 2;
  string output_event_id = 3; // Canonical lowercase UUIDv7 conversation event.
  bytes output_digest = 4; // Exactly 32 domain-separated signed-event digest bytes.
}

// Successful terminal claim. terminal_sequence is one monotonic namespace
// shared by RunCompleted and RunFailed and permits exact idempotent retries.
message RunCompleted {
  RunExecutionFence execution_fence = 1;
  uint64 terminal_sequence = 2; // Positive; exactly one terminal claim is accepted.
  string result_event_id = 3; // Canonical lowercase UUIDv7 encrypted result event.
  bytes result_digest = 4; // Exactly 32 domain-separated signed-event digest bytes.
}

// Stable terminal failure without prompt, output, stack trace, or provider
// response. Optional evidence fields are both present or both absent. Its
// report digest is COMMIT("dirextalk.run-failed-report.v1", stable-error-code,
// one-byte evidence-presence, artifact UUID bytes?, evidence digest?).
message RunFailed {
  RunExecutionFence execution_fence = 1;
  uint64 terminal_sequence = 2;
  string stable_error_code = 3; // 3..64 bytes, UPPER_SNAKE_CASE.
  string evidence_artifact_id = 4; // Empty or canonical lowercase UUIDv7.
  bytes evidence_digest = 5; // Empty or exactly 32 bytes; paired with artifact id.
}

// Server-side cancellation intent. It is advisory until the exact fenced Run
// emits a terminal claim; a stale request cannot cancel a newer lease epoch.
message RunCancelRequested {
  RunExecutionFence execution_fence = 1;
  string stable_reason = 2; // 3..64 bytes, UPPER_SNAKE_CASE.
  uint64 requested_at_millis = 3; // Server-clock UTC Unix milliseconds.
  uint64 cancel_deadline_millis = 4; // Greater than requested_at_millis.
}

// Causal acknowledgement emitted only after the exact report is durably
// committed. A Connector retains and exactly retries a report until this
// matching receipt arrives.
message RunReportAcknowledged {
  string run_id = 1;
  string run_lease_id = 2;
  uint64 run_lease_epoch = 3;
  string report_kind = 4; // checkpoint | output | completed | failed.
  uint64 report_sequence = 5;
  bytes report_digest = 6; // Exact artifact/event digest, or derived failure digest.
}

// One-time recipient generated by the Rust Agent Device sidecar. The
// authenticated Connector signs the descriptor digest so an Owner client can
// reject a relay-substituted key. The matching private key never enters Go.
message ProvisioningRecipientAnnouncement {
  LeaseFence connector_fence = 1;
  string binding_id = 2; // Canonical lowercase UUIDv7, bound to this Connector.
  string installation_id = 3; // Canonical lowercase UUIDv7.
  string agent_device_id = 4; // Canonical lowercase UUIDv7.
  uint64 provisioning_revision = 5; // Positive, monotonic per Agent Device.
  string recipient_key_id = 6; // Canonical lowercase UUIDv7; one use only.
  bytes recipient_public_key = 7; // Exactly 32 canonical X25519 bytes.
  string credential_id = 8; // Exact currently authenticated credential UUIDv7.
  uint64 created_at_millis = 9; // Connector-observed UTC Unix milliseconds.
  uint64 expires_at_millis = 10; // Greater than created_at_millis; at most ten minutes.
  bytes descriptor_digest = 11; // Exact 32-byte COMMIT defined above.
  bytes recipient_signature = 12; // Exact 64-byte current control-key signature.
}

// Terminal success for one durable DeliverAgentProvisioning command. This
// frame atomically advances the command cursor when the server commits it.
// Exact retries repeat every field until ConnectLease confirms the cursor.
message AgentProvisioningInstalled {
  LeaseFence connector_fence = 1;
  string delivery_id = 2; // Exact durable delivery UUIDv7.
  uint64 command_sequence = 3; // Exact DeliverAgentProvisioning command sequence.
  bytes command_payload_digest = 4; // Exact 32-byte command payload digest.
  bytes encoded_command_digest = 5; // Exact 32-byte raw command digest.
  string recipient_key_id = 6; // Exact one-time recipient UUIDv7.
  bytes capsule_digest = 7; // Exact V23 opaque capsule digest.
  // SHA-256("dirextalk.agent-provisioning-installed-receipt.v1\0" || canonical
  // CBOR numeric map binding tenant, installation, binding, Agent Device,
  // delivery, recipient, bundle revision and capsule digest). The server
  // recomputes it exclusively from durable delivery facts.
  bytes installation_receipt_digest = 8;
  uint64 installed_at_millis = 9; // Connector-observed UTC Unix milliseconds.
  bytes result_digest = 10; // Exact installed-result COMMIT defined above.
}

// Terminal, category-only refusal. It never carries sidecar stderr, a path,
// decrypted material, or capsule plaintext. Permanent/retry classification is
// server policy; changed retries conflict with the durable original result.
message AgentProvisioningRejected {
  LeaseFence connector_fence = 1;
  string delivery_id = 2;
  uint64 command_sequence = 3;
  bytes command_payload_digest = 4;
  bytes encoded_command_digest = 5;
  string recipient_key_id = 6;
  bytes capsule_digest = 7;
  string stable_error_code = 8; // 3..64 bytes, UPPER_SNAKE_CASE.
  uint64 rejected_at_millis = 9;
  bytes result_digest = 10; // Exact rejected-result COMMIT defined above.
}

// Exact result for one durable PrepareAgentRouteRecipient command. The
// recipient capsule is opaque to the Connector and Agent Control; it is
// addressed to the Owner device and only native Rust may decrypt it.
message AgentRouteRecipientReady {
  LeaseFence connector_fence = 1;
  string bootstrap_id = 2;
  uint64 command_sequence = 3;
  bytes command_payload_digest = 4;
  bytes encoded_command_digest = 5;
  string installation_id = 6;
  string binding_id = 7;
  string agent_control_device_id = 8;
  string recipient_id = 9;
  bytes recipient_capsule_digest = 10;
  bytes opaque_recipient_capsule = 11;
  uint64 expires_at_millis = 12;
  bytes result_digest = 13;
  // Present only when the stream negotiated minor 1.6 with
  // `agent-route-health.v1`; the private key never enters Agent Control.
  string route_health_key_id = 14; // Canonical lowercase UUIDv7 text.
  bytes route_health_public_key = 15; // Exactly 32 canonical Ed25519 bytes.
}

// Terminal success for one durable DeliverAgentRouteBootstrap command. The
// sidecar emits this only after it has atomically persisted the isolated route
// engine and binding. route_fence is opaque native state used by later Run
// admission; it is neither a route secret nor decryptable payload.
message AgentRouteBootstrapInstalled {
  LeaseFence connector_fence = 1;
  string bootstrap_id = 2;
  string delivery_id = 3;
  string route_id = 4;
  uint64 command_sequence = 5;
  bytes command_payload_digest = 6;
  bytes encoded_command_digest = 7;
  string installation_id = 8;
  string binding_id = 9;
  string agent_control_device_id = 10;
  string recipient_id = 11;
  bytes capsule_digest = 12;
  bytes route_fence = 13;
  uint64 installed_at_millis = 14;
  bytes result_digest = 15;
  // Exact key binding selected during recipient preparation.
  string route_health_key_id = 16; // Canonical lowercase UUIDv7 text.
  // SHA-256("dirextalk.agent-route-health-public-key.v1\\0" || public key).
  bytes route_health_public_key_digest = 17; // Exactly 32 domain-separated bytes.
}

// Category-only terminal refusal for the same exact delivery. It preserves
// non-sensitive binding facts and never carries a sidecar error string or
// capsule plaintext.
message AgentRouteBootstrapRejected {
  LeaseFence connector_fence = 1;
  string bootstrap_id = 2;
  string delivery_id = 3;
  string route_id = 4;
  uint64 command_sequence = 5;
  bytes command_payload_digest = 6;
  bytes encoded_command_digest = 7;
  string installation_id = 8;
  string binding_id = 9;
  string agent_control_device_id = 10;
  string recipient_id = 11;
  bytes capsule_digest = 12;
  string stable_error_code = 13;
  uint64 rejected_at_millis = 14;
  bytes result_digest = 15;
  string route_health_key_id = 16; // Exact command key ID when negotiated.
  // SHA-256("dirextalk.agent-route-health-public-key.v1\\0" || public key).
  bytes route_health_public_key_digest = 17; // Exactly 32 domain-separated bytes when negotiated.
}

message Hello {
  string tenant_id = 1; // Canonical lowercase UUIDv7 text.
  string connector_id = 2; // Canonical lowercase UUIDv7 text.
  string host_id = 3; // Canonical lowercase UUIDv7 text.
  string boot_id = 4; // Canonical lowercase UUIDv7 text; new for every process boot.
  uint64 connector_generation = 5; // Positive JSON-safe integer.
  uint64 spec_revision = 6; // Positive JSON-safe integer.
  ProtocolRange protocol = 7;
  RuntimeClaims runtime_claims = 8;
  Capacity capacity = 9;
  // Claimed local cursor; it never advances the server cursor without the
  // matching digest-bearing acknowledgement and only guides exact replay.
  uint64 last_applied_command_sequence = 10; // JSON-safe contiguous cursor; zero means none.
  repeated string required_server_capabilities = 11; // At most 32 stable names, each 1..128 bytes.
}

message ProtocolRange {
  uint32 minimum_major = 1; // Positive; agent-control/1 requires 1.
  uint32 minimum_minor = 2;
  uint32 maximum_major = 3; // Positive and not below minimum_major.
  uint32 maximum_minor = 4;
}

message RuntimeClaims {
  string runtime_kind = 1; // 1..64 bytes, lower stable-name syntax.
  string runtime_version = 2; // 1..128 bytes.
  bytes adapter_build_digest = 3; // Exactly 32 SHA-256 bytes.
  repeated string capabilities = 4; // At most 64 unique stable names, each 1..128 bytes.
  uint32 queue_depth = 5; // At most 1000000.
  repeated string active_run_ids = 6; // At most 1024 canonical lowercase UUIDv7 values.
  string stable_error_code = 7; // Empty or 3..64 bytes, UPPER_SNAKE_CASE.
}

message Capacity {
  uint32 maximum_concurrent_runs = 1; // 1..65535.
  uint32 available_concurrent_runs = 2; // At most maximum_concurrent_runs.
  uint32 maximum_queue_depth = 3; // 1..1000000.
}

message LeaseFence {
  string tenant_id = 1; // Canonical lowercase UUIDv7 text.
  string connector_id = 2; // Canonical lowercase UUIDv7 text.
  string boot_id = 3; // Canonical lowercase UUIDv7 text.
  uint64 connector_generation = 4; // Positive JSON-safe integer.
  string lease_id = 5; // Canonical lowercase UUIDv7 text.
  uint64 lease_epoch = 6; // Positive JSON-safe integer.
}

message ConnectLease {
  LeaseFence fence = 1;
  uint32 protocol_major = 2; // Exactly 1 for agent-control/1.
  uint32 protocol_minor = 3;
  uint64 issued_at_millis = 4; // Server-clock UTC Unix milliseconds.
  uint64 expires_at_millis = 5; // Greater than issued_at_millis.
  uint32 heartbeat_interval_millis = 6; // 1000..60000.
  uint32 heartbeat_ttl_millis = 7; // Greater than heartbeat_interval_millis; at most 300000.
  uint64 acknowledged_command_sequence = 8; // Contiguous cursor; zero means none.
  // Canonical sorted server capability names for the negotiated session.
  // Minor 1.5 peers never receive or interpret this additive field.
  repeated string server_capabilities = 9;
}

message Ready {
  LeaseFence fence = 1;
  uint64 applied_config_revision = 2; // Positive JSON-safe integer.
  // Observation only; CommandAcknowledgement advances the server cursor.
  uint64 applied_command_sequence = 3; // Contiguous cursor; zero means none.
}

message Heartbeat {
  LeaseFence fence = 1;
  // New values are strictly monotonic per lease; an exact retry may repeat the
  // latest value and receives the original persisted acknowledgement.
  uint64 heartbeat_sequence = 2; // Positive JSON-safe integer.
  uint64 applied_config_revision = 3; // Positive JSON-safe integer.
  // Observation only; CommandAcknowledgement advances the server cursor.
  uint64 applied_command_sequence = 4; // Contiguous cursor; zero means none.
  RuntimeClaims runtime_claims = 5;
  Capacity capacity = 6; // Current live capacity; maximums must match Hello.
}

message HeartbeatAcknowledgement {
  uint64 heartbeat_sequence = 1; // Exact accepted sequence.
  uint64 observed_at_millis = 2; // Server-clock UTC Unix milliseconds.
  uint64 lease_expires_at_millis = 3; // Server-clock expiry.
}

message CommandAcknowledgement {
  LeaseFence fence = 1;
  uint64 command_sequence = 2; // Positive and exactly one beyond the durable cursor.
  bytes payload_digest = 3; // Exact 32-byte selected-payload digest carried by DurableCommand.
  bytes encoded_command_digest = 4; // Exact 32-byte digest carried by DurableCommandFrame.
}

// Raw envelope for one durable command. Keeping the nested command encoded is
// intentional: reconnect and replica failover can replay its exact reviewed
// bytes without a decode/re-encode cycle that would discard future unknown
// fields. Connectors verify the digest before decoding DurableCommand.
message DurableCommandFrame {
  bytes encoded_command = 1; // 1..196608 exact DurableCommand Protobuf bytes.
  // Exactly 32 bytes using the encoded-command COMMIT defined above.
  bytes encoded_command_digest = 2;
}

message DurableCommand {
  uint64 command_sequence = 1; // Positive, monotonically increasing per Connector.
  string operation_id = 2; // Canonical lowercase UUIDv7 text.
  uint64 connector_generation = 3; // Positive JSON-safe integer.
  uint64 spec_revision = 4; // Positive JSON-safe integer.
  // Exactly 32 bytes using the command-payload COMMIT defined above over the
  // exact selected payload submessage, excluding this enclosing message.
  bytes payload_digest = 5;
  // The server separately persists and replays this complete message
  // byte-for-byte; the full wrapper is never reconstructed from the digest.
  oneof command {
    ApplyConfig apply_config = 10;
    RotateCredential rotate_credential = 11;
    CloseStream close_stream = 12;
    DeliverAgentProvisioning deliver_agent_provisioning = 13;
    RevokeAgentProvisioning revoke_agent_provisioning = 14;
    PrepareAgentRouteRecipient prepare_agent_route_recipient = 15;
    DeliverAgentRouteBootstrap deliver_agent_route_bootstrap = 16;
  }
}

message DeliverAgentProvisioning {
  string delivery_id = 1; // Canonical lowercase UUIDv7.
  string approval_id = 2; // Canonical lowercase UUIDv7.
  string binding_id = 3; // Exact binding owned by this Connector.
  string installation_id = 4; // Canonical lowercase UUIDv7.
  string agent_device_id = 5; // Canonical lowercase UUIDv7.
  uint64 provisioning_revision = 6; // Exact approved revision.
  string recipient_key_id = 7; // Exact unexpired, unconsumed recipient UUIDv7.
  bytes recipient_descriptor_digest = 8; // Exact 32-byte signed descriptor digest.
  bytes capsule_digest = 9; // Exact 32-byte V23 opaque capsule digest.
  bytes sealed_capsule = 10; // 1..196608 bytes; HPKE ciphertext only.
  uint64 expires_at_millis = 11; // Server-clock deadline; expired commands fail closed.
}

// Fail-closed local stop/delete after server-side routing was already revoked.
message RevokeAgentProvisioning {
  string revocation_id = 1;
  string installation_id = 2;
  string binding_id = 3; // Exact local bundle binding; never inferred from installation alone.
  string agent_device_id = 4; // Empty only for installation-wide revocation.
  uint64 revocation_revision = 5;
  uint64 requested_at_millis = 6;
}

// First phase of an isolated AgentRoute bootstrap. owner_signed_intent is an
// already-signed opaque native request. The Connector validates only bounded
// transport shape and immutable IDs before forwarding it to the sidecar; it
// never verifies, parses, or logs the intent contents.
message PrepareAgentRouteRecipient {
  string bootstrap_id = 1;
  string tenant_id = 2;
  string installation_id = 3;
  string binding_id = 4;
  string agent_control_device_id = 5;
  string owner_identity_id = 6;
  string owner_device_id = 7;
  bytes owner_signed_intent = 8;
  uint64 expires_at_millis = 9;
}

// Second phase. The Owner has already created and persisted a separate MLS
// AgentRoute before uploading this opaque capsule. The Connector validates
// only exact identifiers, capsule digest, and deadline, then asks the sidecar
// to import the opaque bytes durably.
message DeliverAgentRouteBootstrap {
  string bootstrap_id = 1;
  string delivery_id = 2;
  string route_id = 3;
  string recipient_id = 4;
  bytes capsule_digest = 5;
  bytes opaque_sealed_bootstrap = 6;
  uint64 expires_at_millis = 7;
  string installation_id = 8;
  string binding_id = 9;
  string agent_control_device_id = 10;
  // Exact health key selected by the authenticated recipient-ready result.
  string route_health_key_id = 11; // Canonical lowercase UUIDv7 text in minor 1.6.
  // SHA-256("dirextalk.agent-route-health-public-key.v1\\0" || public key).
  bytes route_health_public_key_digest = 12; // Exactly 32 domain-separated bytes in minor 1.6.
}

enum DesiredConnectorState {
  DESIRED_CONNECTOR_STATE_UNSPECIFIED = 0;
  DESIRED_CONNECTOR_STATE_RUNNING = 1;
  DESIRED_CONNECTOR_STATE_DRAINING = 2;
  DESIRED_CONNECTOR_STATE_STOPPED = 3;
}

message ApplyConfig {
  uint64 config_revision = 1; // Positive JSON-safe integer; strictly monotonic.
  DesiredConnectorState desired_state = 2; // UNSPECIFIED is invalid.
  repeated ConfigEntry adapter_config = 3; // At most 64 entries.
  repeated ConfigEntry runtime_config = 4; // At most 64 entries.
}

message ConfigEntry {
  string key = 1; // 1..64 bytes, unique lower stable-name syntax.
  string value = 2; // At most 1024 non-secret UTF-8 bytes; empty is allowed.
}

message RotateCredential {
  bytes rotation_nonce = 1; // Exactly 32 unpredictable bytes.
  uint64 successor_revision = 2; // Positive and greater than the current revision.
  uint64 deadline_millis = 3; // JSON-safe UTC Unix milliseconds.
}

enum CloseStreamReason {
  CLOSE_STREAM_REASON_UNSPECIFIED = 0;
  CLOSE_STREAM_REASON_RECONNECT = 1;
  CLOSE_STREAM_REASON_DRAINED = 2;
  CLOSE_STREAM_REASON_REVOKED = 3;
  CLOSE_STREAM_REASON_PROTOCOL_UPGRADE = 4;
}

message CloseStream {
  CloseStreamReason reason = 1; // UNSPECIFIED is invalid.
  string stable_code = 2; // 3..64 bytes, UPPER_SNAKE_CASE.
  string redacted_detail = 3; // At most 512 UTF-8 bytes; no secrets.
}

// A successfully committed proof is the contiguous acknowledgement for its
// RotateCredential command; a separate CommandAcknowledgement is not sent.
message CredentialRotationProof {
  LeaseFence fence = 1;
  string request_id = 2; // Canonical lowercase UUIDv7 idempotency key.
  uint64 command_sequence = 3; // Sequence of the matching RotateCredential command.
  bytes command_payload_digest = 4; // Exact 32-byte matching command-payload digest.
  bytes encoded_command_digest = 5; // Exact 32-byte raw-command digest; proof also acknowledges it.
  uint64 successor_revision = 6; // Exact requested successor revision.
  bytes new_control_public_key = 7; // Exactly 32 canonical Ed25519 bytes.
  bytes current_refresh_signature = 8; // Exactly 64 bytes over the complete rotation transcript.
  bytes new_control_signature = 9; // Exactly 64 bytes over the complete rotation transcript.
}

message CredentialRotationResult {
  string request_id = 1; // Exact request id.
  uint64 command_sequence = 2; // Exact RotateCredential command sequence.
  ConnectorCredential credential = 3; // Pending successor public credential.
  bytes request_digest = 4; // Exactly 32 domain-separated SHA-256 bytes.
  bytes result_digest = 5; // Exactly 32 domain-separated SHA-256 bytes.
}
