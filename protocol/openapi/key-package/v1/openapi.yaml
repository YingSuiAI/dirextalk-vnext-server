openapi: 3.1.0
info:
  title: Dirextalk Opaque KeyPackage Directory Contract
  version: 1.0.0
  description: >-
    An active identity device publishes a detached-signature-bound opaque MLS
    KeyPackage. A second active device atomically claims one package for a
    target identity device. The node never parses OpenMLS state or plaintext.
paths:
  /v1/key-packages/{package_id}:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/DeviceSessionAuthorization'
      - $ref: '#/components/parameters/IdempotencyKey'
    put:
      operationId: publishKeyPackage
      summary: Publish or exactly replay one opaque KeyPackage binding.
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.key-package-publish.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 131072
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/KeyPackagePublished'
        '200':
          $ref: '#/components/responses/KeyPackagePublishReplayed'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '409':
          $ref: '#/components/responses/KeyPackageConflict'
        '422':
          $ref: '#/components/responses/KeyPackageInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/key-packages/claim:
    post:
      operationId: claimKeyPackage
      summary: Atomically claim one available KeyPackage for one target device.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.key-package-claim.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/KeyPackageClaimed'
        '200':
          $ref: '#/components/responses/KeyPackageClaimReplayed'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '404':
          $ref: '#/components/responses/KeyPackageUnavailable'
        '409':
          $ref: '#/components/responses/KeyPackageConflict'
        '422':
          $ref: '#/components/responses/KeyPackageInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    PackageId:
      name: package_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exact active-device session form: DTX-Device-Session
        <canonical UUIDv7>.<43-char unpadded base64url secret>.
      schema:
        type: string
        pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    XRequestId:
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    KeyPackagePublished:
      description: The opaque package binding was committed once.
      $ref: '#/components/responses/PublishReceipt'
    KeyPackagePublishReplayed:
      description: An exact publish retry returned the immutable original receipt.
      $ref: '#/components/responses/PublishReceipt'
    KeyPackageClaimed:
      description: Exactly one available target-device package was consumed.
      $ref: '#/components/responses/ClaimReceipt'
    KeyPackageClaimReplayed:
      description: An exact authenticated claim retry returned the originally consumed package.
      $ref: '#/components/responses/ClaimReceipt'
    PublishReceipt:
      description: A non-cacheable canonical publish receipt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.key-package-publish-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    ClaimReceipt:
      description: A non-cacheable canonical response containing one exact opaque package binding.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.key-package-claim-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    DeviceAuthenticationFailed:
      description: The caller session is missing, expired, revoked, or malformed.
      $ref: '#/components/responses/ErrorResponse'
    KeyPackageUnavailable:
      description: No claimable package is available. This response does not distinguish absent, consumed, expired, or revoked targets.
      $ref: '#/components/responses/ErrorResponse'
    KeyPackageConflict:
      description: The idempotency key or immutable package ID was reused differently.
      $ref: '#/components/responses/ErrorResponse'
    KeyPackageInvalid:
      description: Exact CBOR, detached device binding, package size, or expiry was invalid.
      $ref: '#/components/responses/ErrorResponse'
    ServiceUnavailable:
      description: Durable identity storage is temporarily unavailable.
      $ref: '#/components/responses/ErrorResponse'
    ErrorResponse:
      description: A redacted non-cacheable error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
  schemas:
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ErrorEnvelopeV1:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - DEVICE_AUTHENTICATION_FAILED
                - KEY_PACKAGE_UNAVAILABLE
                - KEY_PACKAGE_CONFLICT
                - KEY_PACKAGE_INVALID
                - IDEMPOTENCY_CONFLICT
                - IDENTITY_SERVICE_UNAVAILABLE
            request_id:
              $ref: '#/components/headers/XRequestId/schema'
            retryable:
              type: boolean
