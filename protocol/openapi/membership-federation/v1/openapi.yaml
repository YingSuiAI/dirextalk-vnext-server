openapi: 3.1.0
info:
  title: Dirextalk Cross-Node Group Authorization Extension
  version: 1.0.0
  description: >-
    V18 extension to the frozen V17 group-membership contract. Cross-node
    callers never forward DTX-Device-Session to a group node. They send the
    canonical identity origin and prove control of an active device key from
    that origin's self-authenticating identity log. Mutation routes and CBOR
    bodies remain V17; their embedded proof is federated-device-action-proof-v2.
    Local same-node requests continue using the V17 Authorization contract.
paths:
  /v1/groups/{scope_kind}/{scope_id}/membership-receipts/{membership_command_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/MembershipCommandId'
    get:
      operationId: getFederatedMembershipReceipt
      summary: Read a membership receipt without forwarding an identity session.
      description: >-
        The proof is freshly signed for this exact receipt path, command, actor,
        device, identity origin, and bounded lifetime. The group node resolves
        and verifies the complete identity log before reading the durable
        receipt. Mixed Authorization and federation headers are rejected.
      parameters:
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/ReceiptQueryProof'
      responses:
        '200':
          description: The canonical V17 membership receipt.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/vnd.dirextalk.membership-receipt.v1+cbor:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/FederatedDeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
components:
  parameters:
    ScopeKind:
      name: scope_kind
      in: path
      required: true
      schema:
        type: string
        enum: [private-conversation, controlled-public-channel]
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: string
        minLength: 36
        maxLength: 57
    MembershipCommandId:
      name: membership_command_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdentityOrigin:
      name: DTX-Identity-Origin
      in: header
      required: true
      description: >-
        Exact canonical identity-node origin embedded in the signed proof.
        HTTPS is mandatory except for an exact server-configured local-dev HTTP
        allowlist. It has no path or trailing slash.
      schema:
        type: string
        minLength: 8
        maxLength: 512
        pattern: '^https?://[^/?#]+$'
    ReceiptQueryProof:
      name: DTX-Receipt-Query-Proof
      in: header
      required: true
      description: >-
        Unpadded base64url canonical CBOR federated-receipt-query-proof-v2.
        It is a fresh query authorization and is never copied from the mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 1366
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    FederatedDeviceAuthenticationFailed:
      description: The origin, identity log, active device, proof lifetime, or signature is invalid.
    GroupAccessDenied:
      description: The verified identity cannot read this receipt.
    GroupResourceUnavailable:
      description: The scope or receipt is unavailable without distinguishing detail.
    GroupServiceUnavailable:
      description: Identity-log resolution or durable storage is temporarily unavailable.
  schemas:
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
