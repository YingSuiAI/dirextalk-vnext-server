openapi: 3.1.0
info:
  title: Dirextalk MLS Commit Sequencer V5
  version: 5.0.0
  description: >-
    Same-identity recovery-add and revoked-device leaf removal controlled by an
    already-active leaf. Commit, Welcome, and KeyPackage material remain opaque;
    exact retries return the original signed receipt. V3 feed items carry a
    consecutive sequence of exact V3, V4, or V5 receipt/Commit pairs.
paths:
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}:
    post:
      operationId: submitMlsCommitV5
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-commit.v5+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 1100000
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/MlsCommitReceiptV5'}
        '200': {$ref: '#/components/responses/MlsCommitReceiptV5'}
        '401': {description: Local session or federated active-device proof rejected.}
        '409': {description: Submission, idempotency, parent epoch, or head conflicts.}
        '422': {description: Recovery request, package, revoke head, controller proof, or exact CBOR rejected.}
    get:
      operationId: getMlsCommitItemV5
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
      responses:
        '200': {$ref: '#/components/responses/MlsCommitReceiptV5'}
        '404': {description: No scoped commit item is visible to the authenticated device.}
  /v1/groups/{scope_kind}/{scope_id}/mls-commits:
    get:
      operationId: listMlsCommitFeedV3
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
        - name: after_epoch
          in: query
          required: true
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: limit
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 64}
      responses:
        '200':
          description: Exact consecutive V3/V4/V5 signed receipt and opaque Commit pairs.
          content:
            application/vnd.dirextalk.mls-commit-feed.v3+cbor:
              x-dirextalk-exact-cbor: true
              schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
        '401': {description: The caller is not authorized for the requested epoch window.}
        '422': {description: Route, query, proof, continuity, or exact CBOR rejected.}
components:
  parameters:
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: false
      schema: {type: string}
    IdentityOrigin:
      name: DTX-Identity-Origin
      in: header
      required: false
      schema: {type: string, pattern: '^https?://[^/?#]+$'}
    MlsCommitProof:
      name: DTX-MLS-Commit-Proof
      in: header
      required: false
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
  responses:
    MlsCommitReceiptV5:
      description: Immutable signed V5 recovery-add or revoked-device removal receipt.
      content:
        application/vnd.dirextalk.mls-commit-receipt.v5+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
