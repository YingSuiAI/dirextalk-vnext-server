openapi: 3.1.0
info:
  title: Dirextalk MLS Commit Sequencer Member Removal
  version: 4.0.0
  description: >-
    V32 Owner-only member removal. A successful request atomically persists the
    opaque MLS Remove commit, product-policy transition, removed leaf, new MLS
    head, outbox, and immutable signed receipt. V2/V3 remain readable.
paths:
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}:
    post:
      operationId: submitMlsMemberRemovalV4
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-commit.v4+cbor:
            schema: {$ref: '#/components/schemas/ExactCbor'}
      responses:
        '200': {$ref: '#/components/responses/V4Receipt'}
        '201': {$ref: '#/components/responses/V4Receipt'}
        '401': {description: The local session or federated active-device proof is rejected.}
        '409': {description: The submission, idempotency key, commit, epoch, or head conflicts.}
        '422': {description: The actor is not Owner, the Owner is targeted, the target leaf is not exact, or the policy revision is stale.}
    get:
      operationId: getMlsMemberRemovalReceiptV4
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
      responses:
        '200': {$ref: '#/components/responses/V4Receipt'}
        '404': {description: No scoped submission is visible to the authenticated device.}
  /v1/groups/{scope_kind}/{scope_id}/mls-commits:
    get:
      operationId: listMlsCommitsV2
      description: >-
        Returns consecutive V3 admission and V4 removal commits. An identity
        removed at epoch N may fetch through N exactly once but cannot read
        later epochs. V1 feed consumers must upgrade before a V4 boundary.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdentityOrigin'
        - $ref: '#/components/parameters/MlsCommitProof'
        - name: after_epoch
          in: query
          required: true
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: limit
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 64}
      responses:
        '200':
          description: Exact V2 canonical-CBOR feed page.
          content:
            application/vnd.dirextalk.mls-commit-feed.v2+cbor:
              schema: {$ref: '#/components/schemas/ExactCbor'}
        '401': {description: The caller is neither active nor eligible for its final removal epoch.}
        '422': {description: The route, query, proof, or media type is invalid.}
components:
  parameters:
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: false
      schema: {type: string}
    IdentityOrigin:
      name: DTX-Identity-Origin
      in: header
      required: false
      schema: {type: string, pattern: '^https?://[^/?#]+$'}
    MlsCommitProof:
      name: DTX-MLS-Commit-Proof
      in: header
      required: false
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  schemas:
    ExactCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
  responses:
    V4Receipt:
      description: Immutable receipt binding the removed leaf and product-policy revision fence.
      content:
        application/vnd.dirextalk.mls-commit-receipt.v4+cbor:
          schema: {$ref: '#/components/schemas/ExactCbor'}
