openapi: 3.1.0
info:
  title: Dirextalk Single-node MLS Commit Sequencer
  version: 1.0.0
  description: Opaque MLS commit serialization and exact-device admission. The server never decodes MLS application plaintext.
paths:
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}:
    parameters:
      - {name: scope_kind, in: path, required: true, schema: {type: string, enum: [private-conversation, controlled-public-channel]}}
      - {name: scope_id, in: path, required: true, schema: {type: string, minLength: 36, maxLength: 57}}
      - {name: submission_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: submitMlsCommit
      summary: CAS-submit one opaque MLS Commit and return its server-signed receipt.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-commit.v1+cbor:
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/CommitReceipt'}
        '200': {$ref: '#/components/responses/CommitReceipt'}
        '401': {description: Device session is missing, expired, revoked, malformed, or tenant-mismatched.}
        '409': {description: Idempotency conflict or stale epoch/head.}
        '422': {description: Approval, controller consent, candidate proof, or bootstrap rule rejected.}
    get:
      operationId: getMlsCommitReceipt
      summary: Query the original immutable receipt after response loss.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
      responses:
        '200': {$ref: '#/components/responses/CommitReceipt'}
        '401': {description: Device session is missing, expired, revoked, malformed, or tenant-mismatched.}
        '404': {description: No such scoped receipt.}
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}/confirmations/{device_id}:
    parameters:
      - {name: scope_kind, in: path, required: true, schema: {type: string, enum: [private-conversation, controlled-public-channel]}}
      - {name: scope_id, in: path, required: true, schema: {type: string, minLength: 36, maxLength: 57}}
      - {name: submission_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: confirmMlsDeviceJoin
      summary: Activate the exact leaf only after its device signs receipt and head.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-device-join-confirmation.v1+cbor:
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '204': {description: Confirmed or exact replay.}
        '401': {description: Device session is missing, expired, revoked, malformed, or tenant-mismatched.}
        '409': {description: Confirmation conflicts with durable facts.}
components:
  parameters:
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exact active-device session form: DTX-Device-Session
        <session-id>.<base64url-secret>. The authenticated identity/device must
        match the actor or confirmation device carried by the canonical body.
      schema:
        type: string
        pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
  responses:
    CommitReceipt:
      description: Immutable server-signed canonical receipt.
      content:
        application/vnd.dirextalk.mls-commit-receipt.v1+cbor:
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
