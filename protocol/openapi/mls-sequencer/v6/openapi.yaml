openapi: 3.1.0
info:
  title: Dirextalk MLS Recovery Sequencer V6
  version: 6.0.0
  description: >-
    Catalog-bound recovery admission with candidate confirmation, authority-local
    activation fencing, hardened activation receipt readback, and identity
    completion presentation. Activation alone never enables routing. Exact
    retries return the original bytes; all responses are non-cacheable.
paths:
  /v1/groups/{scope_kind}/{scope_id}/mls-recovery-commits/{submission_id}:
    post:
      operationId: submitMlsRecoveryCommitV6
      description: >-
        Every path coordinate must match the candidate-signed recovery-add
        request; mismatch is rejected before durable writes.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind:
            source: signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 1]
            comparison: scope-kind-mapping
          scope_id:
            source: signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 2]
            comparison: exact
          submission_id:
            source: signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [2]
            comparison: exact
      x-dirextalk-scope-kind-pairing:
        path-kind: scope_kind
        path-id: scope_id
        mappings:
          private-conversation:
            signed-cbor-kind: 1
            scope-id-schema: '#/components/schemas/UuidV7'
          controlled-public-channel:
            signed-cbor-kind: 2
            scope-id-schema: '#/components/schemas/ChannelId'
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-commit.v6+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/CommitReceipt'}
        '200': {$ref: '#/components/responses/CommitReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
  /v1/groups/{scope_kind}/{scope_id}/mls-recovery-commits/{submission_id}/confirmation:
    put:
      operationId: confirmMlsRecoveryCommitV1
      description: >-
        submission_id must match the signed confirmation and the scope must
        match its stored candidate-signed recovery-add request; mismatch is
        rejected before durable writes.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 1]
            comparison: scope-kind-mapping
          scope_id:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 2]
            comparison: exact
          submission_id:
            source: signed-request-cbor
            cddl-rule: mls-recovery-confirmation-v1
            cbor-path: [2]
            comparison: exact
      x-dirextalk-scope-kind-pairing:
        path-kind: scope_kind
        path-id: scope_id
        mappings:
          private-conversation:
            signed-cbor-kind: 1
            scope-id-schema: '#/components/schemas/UuidV7'
          controlled-public-channel:
            signed-cbor-kind: 2
            scope-id-schema: '#/components/schemas/ChannelId'
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-confirmation.v1+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '200': {$ref: '#/components/responses/CommitReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
  /v1/groups/{scope_kind}/{scope_id}/mls-recovery-activations/{activation_id}:
    put:
      operationId: activateMlsRecoveryV1
      description: >-
        activation_id must match the signed activation command and the scope
        must match its stored candidate-signed recovery-add request; mismatch
        is rejected before durable writes.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 1]
            comparison: scope-kind-mapping
          scope_id:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 2]
            comparison: exact
          activation_id:
            source: signed-request-cbor
            cddl-rule: mls-recovery-activation-command-v1
            cbor-path: [2]
            comparison: exact
      x-dirextalk-scope-kind-pairing:
        path-kind: scope_kind
        path-id: scope_id
        mappings:
          private-conversation:
            signed-cbor-kind: 1
            scope-id-schema: '#/components/schemas/UuidV7'
          controlled-public-channel:
            signed-cbor-kind: 2
            scope-id-schema: '#/components/schemas/ChannelId'
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/ActivationId'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-activation.v1+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/ActivationReceipt'}
        '200': {$ref: '#/components/responses/ActivationReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
    get:
      operationId: getMlsRecoveryActivationReceiptV1
      description: >-
        scope_kind, scope_id, and activation_id must match the returned
        activation readback CBOR; mismatch is rejected before readback.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-readback
        coordinates:
          scope_kind:
            source: stored-returned-readback-cbor
            cddl-rule: mls-recovery-activation-readback-v1
            cbor-path: [2, 1]
            comparison: scope-kind-mapping
          scope_id:
            source: stored-returned-readback-cbor
            cddl-rule: mls-recovery-activation-readback-v1
            cbor-path: [2, 2]
            comparison: exact
          activation_id:
            source: stored-returned-signed-receipt-cbor
            cddl-rule: signed-mls-recovery-activation-receipt-v1
            cbor-path: [1, 14]
            comparison: exact
      x-dirextalk-scope-kind-pairing:
        path-kind: scope_kind
        path-id: scope_id
        mappings:
          private-conversation:
            signed-cbor-kind: 1
            scope-id-schema: '#/components/schemas/UuidV7'
          controlled-public-channel:
            signed-cbor-kind: 2
            scope-id-schema: '#/components/schemas/ChannelId'
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/ActivationId'
      responses:
        '200': {$ref: '#/components/responses/ActivationReadback'}
        '404': {$ref: '#/components/responses/NotCurrent'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
  /v1/groups/{scope_kind}/{scope_id}/mls-recovery-activations/{activation_id}/completion:
    put:
      operationId: presentMlsRecoveryCompletionV1
      description: >-
        activation_id must match the signed activation receipt embedded in the
        signed completion presentation, and the scope must match its stored
        candidate-signed recovery-add request; mismatch is rejected before
        durable writes.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 1]
            comparison: scope-kind-mapping
          scope_id:
            source: stored-signed-request-cbor
            cddl-rule: mls-recovery-add-request-v6
            cbor-path: [3, 2]
            comparison: exact
          activation_id:
            source: embedded-signed-activation-receipt-cbor
            cddl-rule: signed-mls-recovery-activation-receipt-v1
            cbor-path: [1, 14]
            comparison: exact
      x-dirextalk-scope-kind-pairing:
        path-kind: scope_kind
        path-id: scope_id
        mappings:
          private-conversation:
            signed-cbor-kind: 1
            scope-id-schema: '#/components/schemas/UuidV7'
          controlled-public-channel:
            signed-cbor-kind: 2
            scope-id-schema: '#/components/schemas/ChannelId'
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/ActivationId'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-completion-presentation.v1+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/CompletionReceipt'}
        '200': {$ref: '#/components/responses/CompletionReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
components:
  parameters:
    ScopeKind:
      name: scope_kind
      in: path
      required: true
      schema:
        type: string
        enum: [private-conversation, controlled-public-channel]
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/GroupScopeId'}
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    ActivationId:
      name: activation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ChannelId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxc1[a-z2-7]{52}$'
    GroupScopeId:
      oneOf:
        - $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/schemas/ChannelId'
  headers:
    NoStore:
      schema: {type: string, const: no-store}
  responses:
    CommitReceipt:
      description: Immutable welcome_pending recovery-add receipt.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-commit-receipt.v6+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    ActivationReceipt:
      description: Authority-signed activated_fenced receipt; it does not enable routing.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-activation-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    ActivationReadback:
      description: Returned only while candidate, request, leaf, and authority-local MLS head remain current.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-activation-readback.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    CompletionReceipt:
      description: Immutable completion-cache receipt enabling the fenced routing branch.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-completion-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    Conflict:
      description: IDEMPOTENCY_CONFLICT, MLS_HEAD_CONFLICT, RECOVERY_STATE_CONFLICT, or COMPLETION_CACHE_CONFLICT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Gone:
      description: RECOVERY_REQUEST_REVOKED or RECOVERY_ACTIVATION_EXPIRED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Invalidated:
      description: IDENTITY_HEAD_CHANGED, CATALOG_HEAD_CHANGED, CATALOG_LEAF_CHANGED, CANDIDATE_KEY_CHANGED, AUTHORITY_CHANGED, or MLS_HEAD_CHANGED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    NotCurrent:
      description: ACTIVATION_RECEIPT_NOT_CURRENT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    InvalidExactCbor:
      description: EXACT_CBOR_INVALID, MLS_RECOVERY_INVALID, SIGNATURE_INVALID, or INCLUSION_PROOF_INVALID.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
