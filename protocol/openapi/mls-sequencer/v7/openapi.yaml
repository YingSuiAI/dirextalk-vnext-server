x-dirextalk-defensive-decode-limits:
  rule: >-
    HTTP entity-body decoding is capped at the exact operation body ceiling;
    transport framing buffers are outside the CBOR entity and confer no larger
    valid-body allowance. Embedded owner objects are additionally capped by the
    owner raw and enclosing-bstr ceilings above before owner validation.
  request-body-limits-equal-exact-schema-max-length: true
  response-body-limits-equal-exact-schema-max-length: true
  implementation-headroom-is-valid-body-allowance: false
