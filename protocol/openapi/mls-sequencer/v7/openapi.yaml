openapi: 3.1.0
info:
  title: Dirextalk MLS Recovery Sequencer V7
  version: 7.0.0
  description: >-
    Private scope-origin sequencing for exhaustive V42 recovery: Catalog-owned
    issuer authorization, V7 MLS add, V2 confirm/activate/readback, one-use
    child evidence issuance, and immutable scope-and-History-context completion
    cache. Routing remains fenced until activation, cache, and current
    authorization all hold.
x-dirextalk-cddl-artifact: protocol/cddl/mls-sequencer/v7/mls-sequencer-v7.cddl
x-dirextalk-catalog-type-ownership:
  owner-artifact: protocol/cddl/recovery-scope-catalog/v2/recovery-scope-catalog-v2.cddl
  never-redefined-here:
    - recovery-scope-catalog-completion-verifier-descriptor-v1
    - recovery-scope-catalog-private-body-v2
    - recovery-scope-catalog-completion-verifier-binding-v1
    - recovery-scope-catalog-leaf-commitment-v2
    - recovery-scope-catalog-opening-v2
    - recovery-scope-catalog-head-v2
    - catalog-merkle-proof-v2
  exact-byte-reference-validation:
    descriptor: recovery-scope-catalog-completion-verifier-descriptor-v1
    private-body: recovery-scope-catalog-private-body-v2
    issuer-authorization-response: recovery-scope-catalog-completion-verifier-binding-unsigned-v1
    opening: recovery-scope-catalog-opening-v2
    signed-head: recovery-scope-catalog-head-v2
    proof: catalog-merkle-proof-v2
  external-domain-ownership:
    membership-receipt:
      owner-artifact: protocol/cddl/recovery-scope-catalog/v2/recovery-scope-catalog-v2.cddl
      owner-private-body-rule: recovery-scope-catalog-private-body-v2
      payload-cbor-path: [6]
      digest-cbor-path: [7]
      domain: "dirextalk.recovery-scope-membership-receipt.v1\0"
      digest-input: exact-raw-bstr-payload-bytes-without-enclosing-cbor-header
      owner-validator-and-currentness: required
      imported-verbatim-without-mls-rehash: required
      counted-in-mls-owned-domain-inventory: false
      bounded-bstr-alone-is-validation: false
  size-check-alone-is-validation: false
x-dirextalk-strict-wire:
  deterministic-canonical-cbor: required
  closed-maps-and-enums: required
  duplicate-or-unknown-map-keys: rejected
  exact-version-discriminator: required
  v6-v7-conversion-or-decoder-fallback: forbidden
  strict-ed25519-and-x25519-semantics: required
  dns-https-authority-origin-only: true
  exact-header-body-idempotency-digest: required
  raw-authorization-or-idempotency-values-persisted: false
  no-partial-durable-writes: true
  request-content-type: exactly-the-operation-media-type-with-no-parameters
  request-content-encoding-header: forbidden
  response-content-encoding-header: forbidden
  body-trailing-bytes: rejected
x-dirextalk-http-header-contract:
  authorization:
    field-count: exactly-one-on-every-authenticated-operation
    value-count: exactly-one
    grammar: 'DTX-Device-Session <uuidv7>.<43-character-base64url-without-padding>'
    pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
    duplicate-comma-list-obs-fold-or-surrounding-whitespace: rejected-before-authentication
    raw-value-persistence-or-response: forbidden
    role-binding: authenticated-identity-device-and-current-key-must-exactly-match-the-operation-role-and-signed-body
  idempotency-key:
    field-count: exactly-one-on-every-mutation
    value-count: exactly-one
    length-octets: {minimum: 16, maximum: 128}
    allowed-octets: 'ASCII VCHAR 0x21..0x7e'
    duplicate-comma-list-obs-fold-non-ascii-or-any-whitespace: rejected-before-idempotency-lookup
    normalization-or-re-encoding: forbidden
    digest-input: exact-post-http-parsing-ascii-octets
    raw-value-persistence-or-response: forbidden
