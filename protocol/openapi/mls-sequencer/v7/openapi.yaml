      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-activation.v2+cbor:
            x-dirextalk-cddl-rule: mls-recovery-activation-command-v2
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ActivationCommandCbor'}
      responses:
        '201': {$ref: '#/components/responses/ActivationReceipt'}
        '200': {$ref: '#/components/responses/ActivationReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
    get:
      operationId: getMlsRecoveryActivationReadbackV2
      x-dirextalk-authentication: {kind: candidate-device, required: true}
      x-dirextalk-idempotency-key-header: forbidden
      x-dirextalk-pre-issuance-currentness-read: true
      x-dirextalk-candidate-readback-binding:
        authenticated-identity-equals-readback-cbor-path: [5]
        authenticated-device-equals-readback-cbor-path: [6]
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-readback
        coordinates:
          scope_kind: {source: stored-returned-readback-cbor, cddl-rule: mls-recovery-activation-readback-v2, cbor-path: [2, 1], comparison: scope-kind-mapping}
          scope_id: {source: stored-returned-readback-cbor, cddl-rule: mls-recovery-activation-readback-v2, cbor-path: [2, 2], comparison: exact}
          activation_id: {source: stored-returned-readback-cbor, cddl-rule: mls-recovery-activation-readback-v2, cbor-path: [3], comparison: exact}
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/ActivationId'
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200': {$ref: '#/components/responses/ActivationReadback'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
  /v2/groups/{scope_kind}/{scope_id}/mls-recovery-evidence-issuances/{issuance_id}:
    post:
      operationId: issueMlsRecoveryCompletionEvidenceV1
      x-dirextalk-authentication: {kind: current-scope-controller, required: true}
      x-dirextalk-replay-order: '#/x-dirextalk-replay-order'
      x-dirextalk-body-ceiling-bytes: 12756
      x-dirextalk-required-state: activated_fenced
      x-dirextalk-linearization-point: first-durable-certificate-and-evidence-commit
      x-dirextalk-idempotency-and-uniqueness:
        route-key: [scope, issuance-id]
        sole-evidence-key:
          - exact-full-signed-issuer-binding-digest-b
          - history-completion-context-digest
        exact-route-body-idempotency-replay: byte-identical-stored-receipt
        changed-route-body-idempotency-or-sole-evidence-key: conflict-no-write
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind: {source: signed-request-cbor, cddl-rule: mls-recovery-evidence-issuance-command-v1, cbor-path: [5, 1], comparison: scope-kind-mapping}
          scope_id: {source: signed-request-cbor, cddl-rule: mls-recovery-evidence-issuance-command-v1, cbor-path: [5, 2], comparison: exact}
          issuance_id: {source: signed-request-cbor, cddl-rule: mls-recovery-evidence-issuance-command-v1, cbor-path: [2], comparison: exact}
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/IssuanceId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-evidence-issuance.v1+cbor:
            x-dirextalk-cddl-rule: mls-recovery-evidence-issuance-command-v1
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/EvidenceIssuanceCommandCbor'}
      responses:
        '201': {$ref: '#/components/responses/EvidenceIssuanceReceipt'}
        '200': {$ref: '#/components/responses/EvidenceIssuanceReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/PreIssuanceGone'}
        '412': {$ref: '#/components/responses/PreIssuanceInvalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
  /v2/groups/{scope_kind}/{scope_id}/mls-recovery-activations/{activation_id}/completion-cache:
    put:
      operationId: cacheMlsRecoveryCompletionV2
      x-dirextalk-authentication: {kind: current-scope-controller, required: true}
      x-dirextalk-replay-order: '#/x-dirextalk-replay-order'
      x-dirextalk-body-ceiling-bytes: 17155
      x-dirextalk-required-state: activated_fenced
      x-dirextalk-idempotency-and-uniqueness:
        semantic-key: [scope, history-completion-context-digest]
        exact-semantic-key-body-idempotency-replay: byte-identical-stored-receipt
        changed-body-idempotency-cache-id-or-activation: conflict-no-write
      x-dirextalk-snapshot-validation:
        activation-receipt-and-readback: exact-private-issuance-time-snapshots
        historical-descriptor-validity: evaluated-at-issuance
        current-descriptor-fetch: forbidden
        later-cache-after-evidence-expiry: allowed-only-after-signed-timely-history-admission
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          scope_kind: {source: signed-request-cbor, cddl-rule: mls-recovery-completion-cache-command-v2, cbor-path: [3, 1], comparison: scope-kind-mapping}
          scope_id: {source: signed-request-cbor, cddl-rule: mls-recovery-completion-cache-command-v2, cbor-path: [3, 2], comparison: exact}
          activation_id: {source: signed-request-cbor, cddl-rule: mls-recovery-completion-cache-command-v2, cbor-path: [5], comparison: exact}
      parameters:
        - $ref: '#/components/parameters/ScopeKind'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/ActivationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-recovery-completion-cache.v2+cbor:
            x-dirextalk-cddl-rule: mls-recovery-completion-cache-command-v2
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/CompletionCacheCommandCbor'}
      responses:
        '201': {$ref: '#/components/responses/CompletionCacheReceipt'}
        '200': {$ref: '#/components/responses/CompletionCacheReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/PostIssuanceCacheGone'}
        '412': {$ref: '#/components/responses/PostIssuanceCacheInvalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
components:
  parameters:
    ScopeKind:
      name: scope_kind
      in: path
      required: true
      schema: {type: string, enum: [private-conversation, controlled-public-channel]}
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/GroupScopeId'}
    CatalogId:
      name: catalog_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    Generation:
      name: generation
      in: path
      required: true
      schema: {type: integer, minimum: 1, maximum: 9007199254740991}
    Index:
      name: index
      in: path
      required: true
      schema: {type: integer, minimum: 1, maximum: 1023}
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    ActivationId:
      name: activation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    IssuanceId:
      name: issuance_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    Authorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exactly one active-device session value in canonical
        DTX-Device-Session <uuidv7>.<43-character-base64url-secret> form.
        Duplicate fields or values, comma lists, obs-fold, and surrounding
        whitespace are rejected before authentication. The authenticated
        identity, device, and current key must satisfy the operation role and
        exact signed-body equality rules.
      x-dirextalk-exact-field-count: 1
      x-dirextalk-exact-value-count: 1
      schema:
        type: string
        pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Exactly one value of 16..128 ASCII octets, each in 0x21..0x7e.
        Duplicate fields or values, comma lists, obs-fold, non-ASCII, invalid
        length, and any whitespace are rejected before lookup. Accepted octets
        are hashed byte-for-byte under the operation domain without
        normalization; the raw value is never persisted or returned.
      x-dirextalk-exact-field-count: 1
      x-dirextalk-exact-value-count: 1
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]{16,128}$'}
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
    IssuerAuthorizationRequestCbor:
      type: string
      contentEncoding: binary
      maxLength: 8953
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-issuer-authorization-request-v1
    RecoveryAddRequestCbor:
      type: string
      contentEncoding: binary
      maxLength: 4489217
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-add-request-v7
    ConfirmationCommandCbor:
      type: string
      contentEncoding: binary
      maxLength: 1510
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-confirmation-v2
    ActivationCommandCbor:
      type: string
      contentEncoding: binary
      maxLength: 6023
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-activation-command-v2
    EvidenceIssuanceCommandCbor:
      type: string
      contentEncoding: binary
      maxLength: 12756
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-evidence-issuance-command-v1
    CompletionCacheCommandCbor:
      type: string
      contentEncoding: binary
      maxLength: 17155
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-completion-cache-command-v2
    CatalogDescriptorCbor:
      type: string
      contentEncoding: binary
      maxLength: 2226
      x-dirextalk-exact-cbor: true
      x-dirextalk-owner-cddl-rule: recovery-scope-catalog-completion-verifier-descriptor-v1
    IssuerAuthorizationCbor:
      type: string
      contentEncoding: binary
      maxLength: 2613
      x-dirextalk-exact-cbor: true
      x-dirextalk-owner-cddl-rule: recovery-scope-catalog-completion-verifier-binding-unsigned-v1
    SignedAddReceiptCbor:
      type: string
      contentEncoding: binary
      maxLength: 791
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: signed-mls-recovery-add-receipt-v7
    SignedConfirmationReceiptCbor:
      type: string
      contentEncoding: binary
      maxLength: 791
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: signed-mls-recovery-confirmation-receipt-v2
    SignedActivationReceiptCbor:
      type: string
      contentEncoding: binary
      maxLength: 903
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: signed-mls-recovery-activation-receipt-v2
    ActivationReadbackCbor:
      type: string
      contentEncoding: binary
      maxLength: 1556
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-activation-readback-v2
    EvidenceIssuanceReceiptCbor:
      type: string
      contentEncoding: binary
      maxLength: 975
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: mls-recovery-evidence-issuance-receipt-v1
    SignedCompletionCacheReceiptCbor:
      type: string
      contentEncoding: binary
      maxLength: 660
      x-dirextalk-exact-cbor: true
      x-dirextalk-cddl-rule: signed-mls-recovery-completion-cache-receipt-v2
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ChannelId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxc1[a-z2-7]{52}$'
    GroupScopeId:
      oneOf:
        - $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/schemas/ChannelId'
  headers:
    NoStore:
      schema: {type: string, const: no-store}
  responses:
    CatalogDescriptor:
      description: Exact Catalog V2-owned current completion verifier descriptor; no MLS-local lookalike type.
      x-dirextalk-body-ceiling-bytes: 2226
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.recovery-scope-catalog-completion-verifier-descriptor.v1+cbor:
          x-dirextalk-owner-cddl-rule: recovery-scope-catalog-completion-verifier-descriptor-v1
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/CatalogDescriptorCbor'}
    IssuerAuthorization:
      description: Exact Catalog V2 verifier-binding fields 1 through 22; caller appends no scope-service alternative representation.
      x-dirextalk-body-ceiling-bytes: 2613
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.recovery-scope-catalog-completion-verifier-binding-unsigned.v1+cbor:
          x-dirextalk-owner-cddl-rule: recovery-scope-catalog-completion-verifier-binding-unsigned-v1
          x-dirextalk-exact-fields: [1, 22]
          schema: {$ref: '#/components/schemas/IssuerAuthorizationCbor'}
    AddReceipt:
      description: Immutable authority-signed V7 welcome_pending receipt.
      x-dirextalk-body-ceiling-bytes: 791
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-commit-receipt.v7+cbor:
          x-dirextalk-cddl-rule: signed-mls-recovery-add-receipt-v7
          schema: {$ref: '#/components/schemas/SignedAddReceiptCbor'}
    ConfirmationReceipt:
      description: Immutable authority-signed V2 candidate_confirmed receipt echoing both distinct final heads.
      x-dirextalk-body-ceiling-bytes: 791
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-confirmation-receipt.v2+cbor:
          x-dirextalk-cddl-rule: signed-mls-recovery-confirmation-receipt-v2
          schema: {$ref: '#/components/schemas/SignedConfirmationReceiptCbor'}
    ActivationReceipt:
      description: Immutable authority-signed activated_fenced receipt; routing remains denied.
      x-dirextalk-body-ceiling-bytes: 903
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-activation-receipt.v2+cbor:
          x-dirextalk-cddl-rule: signed-mls-recovery-activation-receipt-v2
          schema: {$ref: '#/components/schemas/SignedActivationReceiptCbor'}
    ActivationReadback:
      description: Authority-signed V2 readback after current pre-issuance checks, with identity H+1 and authority MLS head kept distinct.
      x-dirextalk-body-ceiling-bytes: 1556
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-activation-readback.v2+cbor:
          x-dirextalk-cddl-rule: mls-recovery-activation-readback-v2
          schema: {$ref: '#/components/schemas/ActivationReadbackCbor'}
    EvidenceIssuanceReceipt:
      description: Atomic immutable child certificate plus exactly one redacted child-signed evidence and digests of the private historical issuance snapshots.
      x-dirextalk-body-ceiling-bytes: 975
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-evidence-issuance-receipt.v1+cbor:
          x-dirextalk-cddl-rule: mls-recovery-evidence-issuance-receipt-v1
          schema: {$ref: '#/components/schemas/EvidenceIssuanceReceiptCbor'}
    CompletionCacheReceipt:
      description: Immutable authority-signed scope-and-History-context cache receipt; one required input to the routing predicate.
      x-dirextalk-body-ceiling-bytes: 660
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.mls-recovery-completion-cache-receipt.v2+cbor:
          x-dirextalk-cddl-rule: signed-mls-recovery-completion-cache-receipt-v2
          schema: {$ref: '#/components/schemas/SignedCompletionCacheReceiptCbor'}
    Unauthorized:
      description: AUTHENTICATION_REQUIRED, CATALOG_AUTHORITY_REQUIRED, CANDIDATE_REQUIRED, or CURRENT_CONTROLLER_REQUIRED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Conflict:
      description: IDEMPOTENCY_CONFLICT, MLS_HEAD_CONFLICT, STATE_CONFLICT, ISSUER_REQUEST_ALREADY_USED, CHILD_EVIDENCE_ALREADY_ISSUED, or CACHE_CONFLICT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Gone:
      description: REQUEST_REVOKED, DEVICE_REVOKED, ISSUER_REVOKED, ACTIVATION_REVOKED, or WORKFLOW_EXPIRED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Invalidated:
      description: DESCRIPTOR_CHANGED, CATALOG_CHANGED, AUTHORITY_CHANGED, MLS_HEAD_CHANGED, CONTROLLER_CHANGED, or ACTIVATION_NOT_CURRENT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    PreIssuanceGone:
      description: Before durable issuance only — EXPLICIT_ISSUER_CATALOG_REQUEST_CANDIDATE_DEVICE_MEMBER_OR_ACTIVATION_REVOCATION, or WORKFLOW_OR_AUTHORITY_WINDOW_EXPIRED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    PreIssuanceInvalidated:
      description: Before the final issuance CAS only — DESCRIPTOR_ACTIVATION_READBACK_OR_AUTHORITY_ANCHOR_CHANGED, or AUTHORIZATION_OR_REVOCATION_REVISION_CHANGED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    PostIssuanceCacheGone:
      description: After durable issuance — EXPLICIT_ISSUER_CATALOG_REQUEST_CANDIDATE_DEVICE_MEMBER_OR_ACTIVATION_REVOCATION; evidence expiry alone is not gone after timely signed History admission.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    PostIssuanceCacheInvalidated:
      description: During first admission — STORED_ISSUANCE_SNAPSHOT_MISMATCH, INVALID_OR_CHANGED_HISTORY_PRESENTATION_BEFORE_FINAL_CAS, HISTORY_FIRST_ADMISSION_NOT_BEFORE_EVIDENCE_EXPIRY, CURRENT_AUTHORIZATION_OR_REVOCATION_RACE, or ACTIVATION_ANCHOR_NOT_IN_CURRENT_LOCAL_MLS_LINEAGE. A committed semantic key with any changed command is 409; routine descriptor rotation and ordinary descendant MLS head advance are not invalidation.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    InvalidExactCbor:
      description: EXACT_CBOR_INVALID, OWNER_TYPE_INVALID, COORDINATE_MISMATCH, SIGNATURE_INVALID, PROOF_INVALID, FORBIDDEN_PRIVATE_OR_REDACTED_FIELD, or VERSION_FALLBACK_FORBIDDEN.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    NotFound:
      description: Exact current descriptor, activation, or readback does not exist.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
