openapi: 3.1.0
info:
  title: Dirextalk MLS Commit Sequencer Approved Identity Join
  version: 3.0.0
  description: >-
    V30 approved-identity path. The Owner/Admin authenticates the final Commit;
    the candidate does not sign it. Authorization is derived from the durable
    V2 candidate join and approval facts, including their request and package
    digests. V2 receipts remain queryable.
paths:
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}:
    post:
      operationId: submitMlsCommitV3
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-commit.v3+cbor:
            schema: {$ref: '#/components/schemas/ExactCbor'}
      responses:
        '200': {$ref: '#/components/responses/V3Receipt'}
        '201': {$ref: '#/components/responses/V3Receipt'}
        '409': {description: Idempotency or parent epoch/head conflict.}
        '422': {description: Durable join, approval, package, or actor authorization rejected.}
    get:
      operationId: getMlsCommitReceiptV3
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
      responses:
        '200': {$ref: '#/components/responses/V3Receipt'}
        '404': {description: No scoped submission.}
  /v1/groups/{scope_kind}/{scope_id}/mls-commits/{submission_id}/confirmations/{device_id}:
    post:
      operationId: confirmMlsDeviceJoinV3
      description: >-
        A same-node peer may use its active device session. A remote peer omits
        Authorization and supplies DTX-Identity-Origin plus a fresh
        DTX-MLS-Confirmation-Proof. Response-loss retry uses a new proof but the
        same stable body/signature and resolves the same unique leaf.
      parameters:
        - name: DTX-Identity-Origin
          in: header
          required: false
          schema: {type: string, pattern: '^https?://[^/?#]+$'}
        - name: DTX-MLS-Confirmation-Proof
          in: header
          required: false
          schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mls-device-join-confirmation.v3+cbor:
            schema: {$ref: '#/components/schemas/ExactCbor'}
      responses:
        '204': {description: Confirmed or exact stable-body replay.}
        '401': {description: Session/origin, active device, proof, or signature rejected.}
        '409': {description: Stable confirmation conflicts with the durable leaf.}
components:
  parameters:
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  schemas:
    ExactCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
  responses:
    V3Receipt:
      description: Signed immutable receipt binding package, join, and approval digests.
      content:
        application/vnd.dirextalk.mls-commit-receipt.v3+cbor:
          schema: {$ref: '#/components/schemas/ExactCbor'}
