openapi: 3.1.0
info:
  title: Dirextalk Opaque Mailbox Relay Contract
  version: 1.0.0
  description: >-
    An active device registers an opaque mailbox with a one-way write-capability
    hash. Capability holders append opaque ciphertext, while active owner devices
    pull and acknowledge delivery. The relay never receives a raw capability in a
    body, plaintext message content, or MLS state.
paths:
  /v1/mailboxes/{mailbox_id}:
    parameters:
      - $ref: '#/components/parameters/MailboxId'
      - $ref: '#/components/parameters/DeviceSessionAuthorization'
      - $ref: '#/components/parameters/IdempotencyKey'
    put:
      operationId: registerMailbox
      summary: Register or exactly replay an owner mailbox.
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mailbox-register.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/MailboxRegistered'
        '200':
          $ref: '#/components/responses/MailboxRegisterReplayed'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '409':
          $ref: '#/components/responses/MailboxConflict'
        '422':
          $ref: '#/components/responses/MailboxInvalid'
        '503':
          $ref: '#/components/responses/MailboxServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/envelopes/{envelope_id}:
    parameters:
      - $ref: '#/components/parameters/MailboxId'
      - $ref: '#/components/parameters/EnvelopeId'
      - $ref: '#/components/parameters/MailboxCapabilityAuthorization'
      - $ref: '#/components/parameters/IdempotencyKey'
    put:
      operationId: appendMailboxEnvelope
      summary: Append or exactly replay one opaque ciphertext envelope.
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mailbox-envelope.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 262400
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/MailboxEnvelopeAccepted'
        '200':
          $ref: '#/components/responses/MailboxEnvelopeReplayed'
        '404':
          $ref: '#/components/responses/MailboxUnavailable'
        '409':
          $ref: '#/components/responses/MailboxConflict'
        '422':
          $ref: '#/components/responses/MailboxInvalid'
        '429':
          $ref: '#/components/responses/MailboxCapacityExceeded'
        '503':
          $ref: '#/components/responses/MailboxServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/pull:
    parameters:
      - $ref: '#/components/parameters/MailboxId'
      - $ref: '#/components/parameters/DeviceSessionAuthorization'
    post:
      operationId: pullMailboxEnvelopes
      summary: Pull one bounded page of opaque envelopes after a delivery cursor.
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mailbox-pull.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/MailboxPullReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '404':
          $ref: '#/components/responses/MailboxUnavailable'
        '422':
          $ref: '#/components/responses/MailboxInvalid'
        '503':
          $ref: '#/components/responses/MailboxServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/acks:
    parameters:
      - $ref: '#/components/parameters/MailboxId'
      - $ref: '#/components/parameters/DeviceSessionAuthorization'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: acknowledgeMailboxEnvelopes
      summary: Acknowledge a bounded nonempty set of already persisted envelopes.
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.mailbox-acks.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 8192
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/MailboxAcksCommitted'
        '200':
          $ref: '#/components/responses/MailboxAcksReplayed'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '404':
          $ref: '#/components/responses/MailboxUnavailable'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/MailboxInvalid'
        '503':
          $ref: '#/components/responses/MailboxServiceUnavailable'
components:
  parameters:
    MailboxId:
      name: mailbox_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    EnvelopeId:
      name: envelope_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Reuse only to retry the exact authenticated request body at its named
        mailbox endpoint. A different reuse returns IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exact active-device session form: DTX-Device-Session
        <canonical UUIDv7>.<43-char unpadded base64url secret>.
      schema:
        type: string
        pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
    MailboxCapabilityAuthorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exact write-only form: DTX-Mailbox-Capability <43-char unpadded
        base64url secret>. The raw 32-byte secret is never persisted, echoed,
        logged, or sent in a CBOR body.
      schema:
        type: string
        pattern: '^DTX-Mailbox-Capability [A-Za-z0-9_-]{43}$'
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    XRequestId:
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    MailboxRegistered:
      description: The mailbox registration was committed once.
      $ref: '#/components/responses/MailboxRegisterReceipt'
    MailboxRegisterReplayed:
      description: Exact retry returned the immutable registration receipt.
      $ref: '#/components/responses/MailboxRegisterReceipt'
    MailboxEnvelopeAccepted:
      description: The opaque envelope was assigned a delivery sequence once.
      $ref: '#/components/responses/MailboxEnvelopeReceipt'
    MailboxEnvelopeReplayed:
      description: Exact retry returned the immutable envelope receipt.
      $ref: '#/components/responses/MailboxEnvelopeReceipt'
    MailboxAcksCommitted:
      description: The requested already-persisted envelopes were acknowledged once.
      $ref: '#/components/responses/MailboxAcksReceipt'
    MailboxAcksReplayed:
      description: Exact retry returned the immutable acknowledgement receipt.
      $ref: '#/components/responses/MailboxAcksReceipt'
    MailboxRegisterReceipt:
      description: A non-cacheable canonical mailbox registration receipt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.mailbox-register-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    MailboxEnvelopeReceipt:
      description: A non-cacheable canonical receipt with no plaintext or capability.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.mailbox-envelope-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    MailboxPullReceipt:
      description: A non-cacheable canonical page containing only opaque ciphertext.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.mailbox-pull-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          x-dirextalk-max-pull-ciphertext-bytes: 1049093
          x-dirextalk-max-pull-entries: 100
          schema:
            type: string
            format: binary
    MailboxAcksReceipt:
      description: A non-cacheable canonical acknowledgement receipt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.mailbox-acks-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    DeviceAuthenticationFailed:
      description: The active-device session is missing, expired, revoked, or malformed.
      $ref: '#/components/responses/ErrorResponse'
    MailboxUnavailable:
      description: >-
        The mailbox is absent or the write capability is absent, expired,
        revoked, malformed, or wrong. This response never reveals which case.
      $ref: '#/components/responses/ErrorResponse'
    MailboxConflict:
      description: An immutable mailbox or envelope identifier was reused differently.
      $ref: '#/components/responses/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key was reused with a different request.
      $ref: '#/components/responses/ErrorResponse'
    MailboxInvalid:
      description: Exact CBOR, identifier, ciphertext bound, page bound, or TTL was invalid.
      $ref: '#/components/responses/ErrorResponse'
    MailboxCapacityExceeded:
      description: The mailbox cannot accept another envelope before capacity is released.
      $ref: '#/components/responses/ErrorResponse'
    MailboxServiceUnavailable:
      description: Durable mailbox storage is temporarily unavailable.
      $ref: '#/components/responses/ErrorResponse'
    ErrorResponse:
      description: A redacted non-cacheable error with no raw secret or plaintext.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
  schemas:
    IdentityId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxi1[a-z2-7]{52}$'
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Base64Url32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
    ErrorEnvelopeV1:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - DEVICE_AUTHENTICATION_FAILED
                - MAILBOX_UNAVAILABLE
                - MAILBOX_CONFLICT
                - IDEMPOTENCY_CONFLICT
                - MAILBOX_INVALID
                - MAILBOX_CAPACITY_EXCEEDED
                - MAILBOX_SERVICE_UNAVAILABLE
            request_id:
              $ref: '#/components/headers/XRequestId/schema'
            retryable:
              type: boolean
