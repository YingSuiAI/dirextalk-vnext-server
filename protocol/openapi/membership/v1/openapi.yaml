openapi: 3.1.0
info:
  title: Dirextalk Tenant-Affine Group Membership Contract
  version: 1.0.0
  description: >-
    A dedicated dtx-group-node manages private conversation membership and
    controlled public-channel subscription policy for one server-configured
    tenant. Tenant identity is derived from node configuration and the active
    device session, never accepted from a path, query, CBOR body, or proof.
    Every mutation is exact canonical CBOR, has an Idempotency-Key, authenticates
    with DTX-Device-Session, and carries a signed device action proof. The node
    persists an intent before any later Sequencer side effect; a reconciling
    membership receipt must be queried rather than submitted again.
paths:
  /v1/groups/{scope_kind}/{scope_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
    put:
      operationId: createGroup
      summary: Create one scoped group with the authenticated identity as Owner.
      description: >-
        The authenticated session identity becomes Owner and first member. It
        does not occupy an administrator slot. The signed action proof binds
        the exact creation path and scope; there is no body-selected owner or
        tenant.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-create.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '201':
          $ref: '#/components/responses/GroupActionReceipt'
        '200':
          $ref: '#/components/responses/GroupActionReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/admins/{administrator_identity_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/AdministratorIdentityId'
    put:
      operationId: grantGroupAdmin
      summary: Grant one Owner-selected additional administrator slot.
      description: >-
        Only the current Owner may grant this role. At most five identities may
        hold Administrator concurrently, excluding the Owner. The target
        identity is bound by the exact signed path.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-grant-admin.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '201':
          $ref: '#/components/responses/GroupActionReceipt'
        '200':
          $ref: '#/components/responses/GroupActionReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/admins/{administrator_identity_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/AdministratorIdentityId'
    post:
      operationId: revokeGroupAdmin
      summary: Revoke one Owner-selected additional administrator slot.
      description: >-
        Only the current Owner may revoke an Administrator. Revocation invalidates
        the former administrator's authority term, including invitations and
        pending approvals made under that term.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-revoke-admin.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '201':
          $ref: '#/components/responses/GroupActionReceipt'
        '200':
          $ref: '#/components/responses/GroupActionReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/InviteId'
    put:
      operationId: issueGroupInvite
      summary: Issue an Owner/Admin invitation capability.
      description: >-
        Owner and current Administrators may issue a bounded, revocable,
        optionally identity-targeted invitation. The exact invitation ID is
        route-bound by the proof and is not a bearer secret.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-issue-invite.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '201':
          $ref: '#/components/responses/GroupActionReceipt'
        '200':
          $ref: '#/components/responses/GroupActionReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/invites/{invite_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/InviteId'
    post:
      operationId: revokeGroupInvite
      summary: Revoke an Owner/Admin invitation capability.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-revoke-invite.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 16384
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '201':
          $ref: '#/components/responses/GroupActionReceipt'
        '200':
          $ref: '#/components/responses/GroupActionReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/join-requests/{join_request_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/JoinRequestId'
    put:
      operationId: requestGroupJoin
      summary: Persist or exactly replay a candidate membership request.
      description: >-
        The active device is the candidate device. A fresh pending approval or
        pending terminal result returns 202; exact replay and an already-member
        committed disposition return the immutable membership receipt. The
        server never consumes an invitation twice after response loss.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-join-request.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 32768
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '202':
          $ref: '#/components/responses/MembershipReceipt'
        '200':
          $ref: '#/components/responses/MembershipReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/join-requests/{join_request_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      operationId: approveGroupJoin
      summary: Persist an Owner/Admin approval and its membership commit intent.
      description: >-
        Owner and current Administrators may approve. A 202 receipt means an
        intent is durable but the Membership Sequencer result is not terminal;
        clients must query the same membership command after an uncertain
        response and must not create another approval command.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.group-approve-join.v1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 32768
            schema:
              $ref: '#/components/schemas/ExactCanonicalCbor'
      responses:
        '202':
          $ref: '#/components/responses/MembershipReceipt'
        '200':
          $ref: '#/components/responses/MembershipReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '409':
          $ref: '#/components/responses/GroupActionConflict'
        '422':
          $ref: '#/components/responses/GroupMutationInvalid'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
  /v1/groups/{scope_kind}/{scope_id}/membership-receipts/{membership_command_id}:
    parameters:
      - $ref: '#/components/parameters/ScopeKind'
      - $ref: '#/components/parameters/ScopeId'
      - $ref: '#/components/parameters/MembershipCommandId'
    get:
      operationId: getMembershipReceipt
      summary: Read the current durable receipt for one membership command.
      description: >-
        This is not a mutation and therefore has no Idempotency-Key or action
        proof. The active session must be the command actor/candidate or a
        currently authorized Owner/Admin reader; unavailable scope, unauthorized
        reader, and unknown receipt are redacted according to the V1 errors.
      parameters:
        - $ref: '#/components/parameters/DeviceSessionAuthorization'
      responses:
        '200':
          $ref: '#/components/responses/MembershipReceipt'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '403':
          $ref: '#/components/responses/GroupAccessDenied'
        '404':
          $ref: '#/components/responses/GroupResourceUnavailable'
        '503':
          $ref: '#/components/responses/GroupServiceUnavailable'
components:
  parameters:
    ScopeKind:
      name: scope_kind
      in: path
      required: true
      description: The literal scope discriminator, which must agree with scope_id.
      schema:
        type: string
        enum: [private-conversation, controlled-public-channel]
    ScopeId:
      name: scope_id
      in: path
      required: true
      description: >-
        A canonical UUIDv7 Conversation ID for private-conversation, or a
        canonical lower-case self-certifying dtxc1 Channel ID for
        controlled-public-channel.
      schema:
        $ref: '#/components/schemas/GroupScopeId'
    AdministratorIdentityId:
      name: administrator_identity_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdentityId'
    InviteId:
      name: invite_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    JoinRequestId:
      name: join_request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    MembershipCommandId:
      name: membership_command_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Reuse only to retry the exact authenticated mutation at the exact named
        route. The proof binds the SHA-256 hash of this raw header value; a
        divergent reuse returns GROUP_IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    DeviceSessionAuthorization:
      name: Authorization
      in: header
      required: true
      description: >-
        Exact active-device session form: DTX-Device-Session
        <canonical UUIDv7>.<43-char unpadded base64url secret>. The session
        derives tenant, actor identity, and actor device; none are accepted as
        unverified request claims.
      schema:
        type: string
        pattern: '^DTX-Device-Session [0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    XRequestId:
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    GroupActionReceipt:
      description: >-
        A non-cacheable canonical receipt for a durable group create, role, or
        invitation mutation. A 200 response is an exact immutable replay.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.group-action-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            $ref: '#/components/schemas/ExactCanonicalCbor'
    MembershipReceipt:
      description: >-
        A non-cacheable canonical current receipt. pending_approval,
        pending_commit, and reconciling are nonterminal; committed includes
        applied or already_member; rejected includes only a stable redacted
        rejection class.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.membership-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            $ref: '#/components/schemas/ExactCanonicalCbor'
    DeviceAuthenticationFailed:
      description: The DTX-Device-Session is missing, expired, revoked, malformed, or tenant-mismatched.
      $ref: '#/components/responses/ErrorResponse'
    GroupAccessDenied:
      description: The authenticated device cannot perform or read this group action.
      $ref: '#/components/responses/ErrorResponse'
    GroupResourceUnavailable:
      description: The scope, action target, or receipt is unavailable without a distinguishing detail.
      $ref: '#/components/responses/ErrorResponse'
    GroupActionConflict:
      description: The scope, expected policy fence, action identity, or idempotency key conflicts with durable state.
      $ref: '#/components/responses/ErrorResponse'
    GroupMutationInvalid:
      description: Exact CBOR, path/scope binding, action proof, expiry, signature, or bounded mutation field is invalid.
      $ref: '#/components/responses/ErrorResponse'
    GroupServiceUnavailable:
      description: Durable group storage or an essential current authorization dependency is temporarily unavailable.
      $ref: '#/components/responses/ErrorResponse'
    ErrorResponse:
      description: >-
        A redacted non-cacheable V17 error. Its code enum is local to this
        membership contract and is not an addition to the global event/error
        registry.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipErrorEnvelopeV1'
  schemas:
    ExactCanonicalCbor:
      type: string
      format: binary
      description: Exact canonical CBOR bytes defined by protocol/cddl/membership/v1/membership-v1.cddl.
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IdentityId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxi1[a-z2-7]{52}$'
    ChannelId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxc1[a-z2-7]{52}$'
    GroupScopeId:
      oneOf:
        - $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/schemas/ChannelId'
    MembershipErrorEnvelopeV1:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - DEVICE_AUTHENTICATION_FAILED
                - GROUP_ACCESS_DENIED
                - GROUP_RESOURCE_UNAVAILABLE
                - GROUP_ACTION_CONFLICT
                - GROUP_IDEMPOTENCY_CONFLICT
                - GROUP_ACTION_PROOF_INVALID
                - GROUP_REQUEST_INVALID
                - GROUP_SERVICE_UNAVAILABLE
            request_id:
              type: string
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
            retryable:
              type: boolean
