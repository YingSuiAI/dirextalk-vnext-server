openapi: 3.1.0
info:
  title: Dirextalk Verified Identity Log Page Contract
  version: 1.0.0
  description: >-
    A read-only, non-cacheable page of exact signed identity-log V1.1 events.
    The server is a transport source, not a trust authority: callers verify the
    contiguous event chain and advertised head locally before trusting devices
    or relay descriptors.
paths:
  /v1/identities/{identity_id}/log:
    get:
      operationId: getIdentityLogPage
      summary: Fetch one contiguous page of exact signed identity-log events.
      parameters:
        - $ref: '#/components/parameters/IdentityId'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          $ref: '#/components/responses/IdentityLogPage'
        '400':
          $ref: '#/components/responses/IdentityLogPageInvalid'
        '404':
          $ref: '#/components/responses/IdentityLogNotFound'
        '409':
          $ref: '#/components/responses/IdentityLogCursorAhead'
        '410':
          $ref: '#/components/responses/IdentityLogInactive'
        '503':
          $ref: '#/components/responses/IdentityLogUnavailable'
components:
  parameters:
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^dtxi1[a-z2-7]{52}$'
    AfterSequence:
      name: after
      in: query
      required: false
      description: >-
        Last locally verified identity-log sequence. Omit or use zero to begin
        at genesis. Values ahead of the advertised head are a conflict, never
        silently reset.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    PageLimit:
      name: limit
      in: query
      required: false
      description: Requested event count; the service may return fewer events to retain the response byte bound.
      schema:
        type: integer
        minimum: 1
        maximum: 64
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    XRequestId:
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    IdentityLogPage:
      description: >-
        A bounded page of exact canonical signed events. `next_after_sequence`
        advances only through bytes in this response; the caller must verify
        the advertised head locally before treating it as current.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/vnd.dirextalk.identity-log-page.v1+cbor:
          x-dirextalk-exact-cbor: true
          x-dirextalk-max-body-bytes: 2097152
          schema:
            type: string
            format: binary
    IdentityLogPageInvalid:
      description: The identity ID, cursor, or limit is non-canonical or out of bounds.
      $ref: '#/components/responses/ErrorResponse'
    IdentityLogNotFound:
      description: No readable identity log exists for the requested self-certifying identity.
      $ref: '#/components/responses/ErrorResponse'
    IdentityLogCursorAhead:
      description: The requested cursor is newer than this source's advertised immutable head.
      $ref: '#/components/responses/ErrorResponse'
    IdentityLogInactive:
      description: The identity log is tombstoned or has verified fork evidence and cannot be served as active.
      $ref: '#/components/responses/ErrorResponse'
    IdentityLogUnavailable:
      description: Durable identity storage is temporarily unavailable.
      $ref: '#/components/responses/ErrorResponse'
    ErrorResponse:
      description: A redacted non-cacheable error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, request_id, retryable]
                properties:
                  code:
                    type: string
                    enum:
                      - IDENTITY_LOG_PAGE_INVALID
                      - IDENTITY_LOG_NOT_FOUND
                      - IDENTITY_LOG_CURSOR_AHEAD
                      - IDENTITY_LOG_INACTIVE
                      - IDENTITY_SERVICE_UNAVAILABLE
                  request_id:
                    $ref: '#/components/headers/XRequestId/schema'
                  retryable:
                    type: boolean
