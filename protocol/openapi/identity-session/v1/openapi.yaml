openapi: 3.1.0
info:
  title: Dirextalk Initial Device and Device Session Contract
  version: 1.0.0
  description: >-
    Root-authorized initial-device enrollment followed by short-lived sessions
    bound to an active DeviceCertificate proof. No endpoint issues or accepts
    a permanent owner bearer credential.
paths:
  /v1/devices/initial-enroll:
    post:
      operationId: initialEnrollDevice
      summary: Commit the root-authorized sequence-two DeviceAdd event.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/GenesisIfMatch'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.identity-log.v1.1+cbor:
            x-dirextalk-exact-cbor: true
            x-dirextalk-max-body-bytes: 1048576
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: '#/components/responses/IdentityAppendCommitted'
        '200':
          $ref: '#/components/responses/IdentityAppendReplayed'
        '409':
          $ref: '#/components/responses/InitialEnrollConflict'
        '422':
          $ref: '#/components/responses/InitialEnrollInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/devices/sessions/challenges:
    post:
      operationId: createDeviceSessionChallenge
      summary: Start a one-time signature challenge for an active device.
      description: >-
        This intentionally does not accept Idempotency-Key: a response-loss
        retry after the five-second per-device challenge interval creates a
        new harmless unconsumed challenge and cannot issue a session without a
        later device signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSessionChallengeRequestV1'
      responses:
        '201':
          $ref: '#/components/responses/DeviceSessionChallengeCreated'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '422':
          $ref: '#/components/responses/DeviceSessionInvalid'
        '429':
          $ref: '#/components/responses/DeviceSessionChallengeRateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/devices/sessions:
    post:
      operationId: completeDeviceSession
      summary: Exchange a complete active-device proof for a short-lived session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSessionCompletionRequestV1'
      responses:
        '201':
          $ref: '#/components/responses/DeviceSessionIssued'
        '200':
          $ref: '#/components/responses/DeviceSessionReplayed'
        '401':
          $ref: '#/components/responses/DeviceAuthenticationFailed'
        '409':
          $ref: '#/components/responses/DeviceSessionConflict'
        '422':
          $ref: '#/components/responses/DeviceSessionInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    GenesisIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact quoted SHA-256 genesis entry hash, for example '"sha256:..."'.
      schema:
        type: string
        pattern: '^"sha256:[a-f0-9]{64}"$'
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    XRequestId:
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    IdentityAppendCommitted:
      description: The initial DeviceAdd committed once.
      content:
        application/vnd.dirextalk.identity-append-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    IdentityAppendReplayed:
      description: Exact retry returned the original append receipt.
      content:
        application/vnd.dirextalk.identity-append-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    DeviceSessionChallengeCreated:
      description: A fresh one-time challenge; its nonce is never stored raw by the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceSessionChallengeResponseV1'
    DeviceSessionIssued:
      description: A short-lived session was issued once. The client retains its own raw secret.
      content:
        application/vnd.dirextalk.device-session-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    DeviceSessionReplayed:
      description: Exact retry returned the original session receipt.
      content:
        application/vnd.dirextalk.device-session-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema:
            type: string
            format: binary
    InitialEnrollConflict:
      description: The genesis head changed or the key was reused with a different event.
      $ref: '#/components/responses/ErrorResponse'
    InitialEnrollInvalid:
      description: The event is not the root-authorized first DeviceAdd.
      $ref: '#/components/responses/ErrorResponse'
    DeviceAuthenticationFailed:
      description: The identity/device/session proof is not currently authorized.
      $ref: '#/components/responses/ErrorResponse'
    DeviceSessionConflict:
      description: The challenge was consumed or the idempotency key was reused differently.
      $ref: '#/components/responses/ErrorResponse'
    DeviceSessionInvalid:
      description: Request framing, encoded fields, or signature payload is invalid.
      $ref: '#/components/responses/ErrorResponse'
    DeviceSessionChallengeRateLimited:
      description: One active device requested another durable challenge too soon.
      $ref: '#/components/responses/ErrorResponse'
    ServiceUnavailable:
      description: Durable identity storage is temporarily unavailable.
      $ref: '#/components/responses/ErrorResponse'
    ErrorResponse:
      description: A redacted non-cacheable error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
  schemas:
    IdentityId:
      type: string
      minLength: 57
      maxLength: 57
      pattern: '^dtxi1[a-z2-7]{52}$'
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Base64Url32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
    Ed25519Signature:
      type: string
      pattern: '^ed25519:[A-Za-z0-9_-]{86}$'
    DeviceSessionChallengeRequestV1:
      type: object
      additionalProperties: false
      required: [identity_id, device_id]
      properties:
        identity_id:
          $ref: '#/components/schemas/IdentityId'
        device_id:
          $ref: '#/components/schemas/UuidV7'
    DeviceSessionChallengeResponseV1:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - identity_id
        - device_id
        - challenge_nonce
        - audience
        - expires_at_ms
        - session_expires_at_ms
      properties:
        challenge_id:
          $ref: '#/components/schemas/UuidV7'
        identity_id:
          $ref: '#/components/schemas/IdentityId'
        device_id:
          $ref: '#/components/schemas/UuidV7'
        challenge_nonce:
          $ref: '#/components/schemas/Base64Url32'
        audience:
          type: string
          minLength: 1
          maxLength: 256
        expires_at_ms:
          type: integer
          format: int64
        session_expires_at_ms:
          type: integer
          format: int64
    DeviceSessionCompletionRequestV1:
      type: object
      additionalProperties: false
      required:
        - identity_id
        - device_id
        - challenge_id
        - session_id
        - challenge_nonce
        - session_secret
        - proof
      properties:
        identity_id:
          $ref: '#/components/schemas/IdentityId'
        device_id:
          $ref: '#/components/schemas/UuidV7'
        challenge_id:
          $ref: '#/components/schemas/UuidV7'
        session_id:
          $ref: '#/components/schemas/UuidV7'
        challenge_nonce:
          $ref: '#/components/schemas/Base64Url32'
        session_secret:
          $ref: '#/components/schemas/Base64Url32'
        proof:
          $ref: '#/components/schemas/Ed25519Signature'
    ErrorEnvelopeV1:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - INITIAL_DEVICE_ENROLL_INVALID
                - INITIAL_DEVICE_ENROLL_CONFLICT
                - DEVICE_SESSION_INVALID
                - DEVICE_AUTHENTICATION_FAILED
                - DEVICE_SESSION_CHALLENGE_EXPIRED
                - DEVICE_SESSION_CHALLENGE_CONSUMED
                - DEVICE_SESSION_CHALLENGE_RATE_LIMITED
                - IDEMPOTENCY_CONFLICT
                - IDENTITY_SERVICE_UNAVAILABLE
            request_id:
              $ref: '#/components/headers/XRequestId/schema'
            retryable:
              type: boolean
