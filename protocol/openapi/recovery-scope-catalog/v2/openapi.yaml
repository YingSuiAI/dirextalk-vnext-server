    HandoffGoneErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_PREPARATION_EXPIRED, RECOVERY_PREPARATION_REVOKED]}
                retryable: {type: boolean, const: false}
    HandoffPreconditionErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [IDENTITY_HEAD_CHANGED, CATALOG_HEAD_CHANGED, CATALOG_AUTHORITY_CHANGED, CANDIDATE_KEY_CHANGED]}
                retryable: {type: boolean, const: false}
    HandoffProviderPreconditionErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [IDENTITY_HEAD_CHANGED, CATALOG_HEAD_CHANGED, CATALOG_AUTHORITY_CHANGED, CANDIDATE_KEY_CHANGED, PROVIDER_KEY_CHANGED, AUTHORITY_CHANGED]}
                retryable: {type: boolean, const: false}
    HandoffTooLargeErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_HANDOFF_TOO_LARGE]}
                retryable: {type: boolean, const: false}
    HandoffUnsupportedMediaErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_HANDOFF_UNSUPPORTED_MEDIA_TYPE]}
                retryable: {type: boolean, const: false}
  headers:
