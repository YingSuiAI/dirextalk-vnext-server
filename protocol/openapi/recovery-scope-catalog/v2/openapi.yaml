components:
  parameters:
    CatalogId:
      name: catalog_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    RequestId:
      name: request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    DeviceAuthorization:
      name: Authorization
      in: header
      required: true
      description: Active-device bearer authorization.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]{16,128}$'}
    EnrollmentCapability:
      name: DTX-Enrollment-Capability
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    ResponseCapability:
      name: DTX-Recovery-Response-Capability
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    StatusAccept:
      name: Accept
      in: header
      required: true
      schema: {type: string, const: application/vnd.dirextalk.recovery-scope-catalog-status.v2+cbor}
    ProviderReceiptAccept:
      name: Accept
      in: header
      required: true
      schema: {type: string, const: application/vnd.dirextalk.recovery-scope-catalog-provider-response-receipt.v2+cbor}
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ErrorEnvelopeV2:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id, retryable]
          properties:
            code: {type: string}
            request_id: {$ref: '#/components/headers/XRequestId/schema'}
            retryable: {type: boolean}
    DeviceAuthenticationErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [DEVICE_AUTHENTICATION_FAILED]}
                retryable: {type: boolean, const: false}
    CatalogConflictErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_CATALOG_CONFLICT, IDEMPOTENCY_CONFLICT]}
                retryable: {type: boolean, const: false}
    CatalogGoneErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_CATALOG_EXPIRED]}
                retryable: {type: boolean, const: false}
    CatalogPreconditionErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [CATALOG_HEAD_CHANGED, CATALOG_AUTHORITY_CHANGED]}
                retryable: {type: boolean, const: false}
    InvalidCatalogErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [EXACT_CBOR_INVALID, RECOVERY_CATALOG_INVALID]}
                retryable: {type: boolean, const: false}
    HandoffCapabilityErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_RESPONSE_CAPABILITY_REJECTED]}
                retryable: {type: boolean, const: false}
    HandoffProviderForbiddenErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_PROVIDER_FORBIDDEN]}
                retryable: {type: boolean, const: false}
    HandoffNotAcceptableErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
        - type: object
          properties:
            error:
              type: object
              properties:
                code: {type: string, enum: [RECOVERY_HANDOFF_NOT_ACCEPTABLE]}
                retryable: {type: boolean, const: false}
    HandoffConflictErrorV2:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelopeV2'}
