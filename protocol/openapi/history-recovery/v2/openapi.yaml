openapi: 3.1.0
info:
  title: Dirextalk History Recovery V3
  version: 3.0.0
  description: >-
    Candidate-signed catalog-bound public request and dual-authority opaque
    history grant. H+1 must be the direct candidate DeviceAdd. Exact retries
    return original receipts; revocation, head/key/catalog changes, and expiry
    invalidate the workflow. Snapshot plaintext has no MLS checkpoint, private
    state, or epoch-secret member. All responses are non-cacheable.
paths:
  /v3/devices/history-recovery-requests:
    post:
      operationId: createHistoryRecoveryRequestV3
      parameters:
        - $ref: '#/components/parameters/ResponseCapability'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.history-recovery-request.v3+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/RequestReceipt'}
        '200': {$ref: '#/components/responses/RequestReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
  /v3/devices/history-recovery-requests/{request_id}:
    delete:
      operationId: revokeHistoryRecoveryRequestV3
      description: >-
        request_id must equal field 2 of the stored candidate-signed request;
        mismatch is rejected before the durable revocation write.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          request_id:
            source: stored-signed-request-cbor
            cddl-rule: history-recovery-request-v3
            cbor-path: [2]
            comparison: exact
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ResponseCapability'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/RevocationReceipt'}
        '401': {$ref: '#/components/responses/CapabilityRejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
  /v4/devices/history-grants:
    post:
      operationId: grantDeviceHistoryV3
      parameters:
        - $ref: '#/components/parameters/DeviceAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.history-recovery-grant.v3+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/DeliveryReceipt'}
        '200': {$ref: '#/components/responses/DeliveryReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
  /v1/identity-home/history-recovery-completion-key:
    get:
      operationId: getHistoryRecoveryCompletionKeyDescriptorV1
      responses:
        '200': {$ref: '#/components/responses/CompletionKeyDescriptor'}
        '404': {$ref: '#/components/responses/NotCurrent'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
  /v1/identity-home/history-recovery-completions/{completion_id}:
    post:
      operationId: completeHistoryRecoveryV1
      description: >-
        completion_id must exactly equal field 2 of the candidate-signed
        completion command; mismatch is rejected before durable writes.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-durable-writes
        coordinates:
          completion_id:
            source: signed-request-cbor
            cddl-rule: history-recovery-completion-command-v1
            cbor-path: [2]
            comparison: exact
      parameters:
        - $ref: '#/components/parameters/CompletionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.dirextalk.history-recovery-completion-command.v1+cbor:
            x-dirextalk-exact-cbor: true
            schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
      responses:
        '201': {$ref: '#/components/responses/CompletionReceipt'}
        '200': {$ref: '#/components/responses/CompletionReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
        '422': {$ref: '#/components/responses/InvalidExactCbor'}
    get:
      operationId: getHistoryRecoveryCompletionV1
      description: >-
        completion_id must exactly equal field 2 of the receipt nested at field
        1 of the stored signed receipt; mismatch is rejected before readback.
      x-dirextalk-path-coordinate-binding:
        reject: reject-before-readback
        coordinates:
          completion_id:
            source: stored-returned-signed-receipt-cbor
            cddl-rule: signed-history-recovery-completion-receipt-v1
            cbor-path: [1, 2]
            comparison: exact
      parameters:
        - $ref: '#/components/parameters/CompletionId'
      responses:
        '200': {$ref: '#/components/responses/CompletionReceipt'}
        '404': {$ref: '#/components/responses/NotCurrent'}
        '410': {$ref: '#/components/responses/Gone'}
        '412': {$ref: '#/components/responses/Invalidated'}
components:
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    CompletionId:
      name: completion_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    DeviceAuthorization:
      name: Authorization
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    ResponseCapability:
      name: DTX-Recovery-Response-Capability
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
  schemas:
    ExactCanonicalCbor:
      type: string
      contentEncoding: binary
      x-dirextalk-exact-cbor: true
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  headers:
    NoStore:
      schema: {type: string, const: no-store}
  responses:
    RequestReceipt:
      description: Immutable exact request receipt.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.history-recovery-request-receipt.v3+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    RevocationReceipt:
      description: Immutable request revocation receipt.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.history-recovery-revocation-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    DeliveryReceipt:
      description: Server-authored exact mailbox H+1 delivery receipt.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.history-recovery-delivery-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    CompletionKeyDescriptor:
      description: TLS-origin-bound, current completion signing key descriptor.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.history-recovery-completion-key-descriptor.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    CompletionReceipt:
      description: >-
        Immutable identity-home transaction receipt. Exact retry returns the
        original bytes; changed command bytes or idempotency key conflict.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/vnd.dirextalk.history-recovery-completion-receipt.v1+cbor:
          x-dirextalk-exact-cbor: true
          schema: {$ref: '#/components/schemas/ExactCanonicalCbor'}
    Conflict:
      description: HISTORY_RECOVERY_CONFLICT, MAILBOX_HEAD_CONFLICT, ATTACHMENT_CONFLICT, or IDEMPOTENCY_CONFLICT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Gone:
      description: HISTORY_RECOVERY_EXPIRED or HISTORY_RECOVERY_REVOKED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    Invalidated:
      description: IDENTITY_HEAD_CHANGED, CATALOG_HEAD_CHANGED, AUTHORITY_CHANGED, CANDIDATE_KEY_CHANGED, or ATTACHMENT_INVALIDATED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    CapabilityRejected:
      description: RECOVERY_RESPONSE_CAPABILITY_REJECTED.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    InvalidExactCbor:
      description: EXACT_CBOR_INVALID, HISTORY_RECOVERY_INVALID, FORBIDDEN_SNAPSHOT_MEMBER, COMPLETION_SIGNATURE_INVALID, ACTIVATION_READBACK_INVALID, or ACTIVATION_PROOF_INVALID.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
    NotCurrent:
      description: COMPLETION_KEY_NOT_CURRENT or COMPLETION_RECEIPT_NOT_CURRENT.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
